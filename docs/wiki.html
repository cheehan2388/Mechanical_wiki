角、凹槽深度、薄牆、公差⋯⋯）都只出現在 1 份來源，先記進 <a class=\"wl\" href=\"#todo\">待寫清單<\/a>，不建頁。<\/li>\n<li>第 1 次檢查失敗 1 項：log.md 沒有 hubs-cost-2026 的收錄紀錄 → 補這一筆。<\/li>\n<li>第 2 次檢查：見下一行輸出。\n<code>頁數：sources 1、parts 0、processes 1、concepts 0、cases 0\n健檢通過<\/code><\/li>\n<\/ul>\n<h2>2026-11-25 #2 收錄 protolabs-cost-2026（Protolabs〈How to Reduce CNC Machining Costs〉）<\/h2>\n<ul>\n<li>讀：網頁全文文字；圖只讀到圖說。<\/li>\n<li>新增：<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>、<a class=\"wl\" href=\"#end-mill\">端銑刀<\/a>（零件頁，兩份來源都直接談刀）、<a class=\"wl\" href=\"#internal-corner-radius\">內角圓角與清角<\/a>、<a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a>、<a class=\"wl\" href=\"#thin-wall\">薄牆與細高特徵<\/a>、<a class=\"wl\" href=\"#machinability\">材料好不好切<\/a>，圖 <code>corner-radius<\/code>、<code>cavity-depth<\/code>。<\/li>\n<li>更新：<a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>（加第二份來源、連到新概念頁）、<a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>、<a class=\"wl\" href=\"#todo\">待寫清單<\/a>。<\/li>\n<li>分支判斷：4 個概念出現在 2 份來源，拆頁；「細高特徵」併進 <a class=\"wl\" href=\"#thin-wall\">薄牆與細高特徵<\/a>（兩者是同一個原因：會晃）。「文字與刻字」也到 2 份，但這輪已新增 5 個非來源頁（AGENTS.md 第 6 節的上限），先留在待辦。<\/li>\n<li><strong>可信度<\/strong>：Hubs 現在屬於 Protolabs 集團，兩份來源不算完全獨立 → 在概念頁註明，並記進待辦要找別家的資料。<\/li>\n<li>第 1 次檢查失敗 1 項：log.md 沒有 protolabs-cost-2026 的收錄紀錄；另有 1 個警告：沒有頁面連到 machinability → 補這一筆紀錄，並從 cnc-milling、導覽頁連過去。<\/li>\n<li>第 2 次檢查：\n<code>頁數：sources 2、parts 1、processes 1、concepts 4、cases 0\n健檢通過<\/code><\/li>\n<\/ul>\n<h2>2026-11-25 #3 收錄 xometry-cost-2020（Xometry〈How to Reduce CNC Machining Costs〉）<\/h2>\n<ul>\n<li>讀：網頁全文文字；沒有看圖。<\/li>\n<li>新增：<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>、<a class=\"wl\" href=\"#tolerance\">公差<\/a>、<a class=\"wl\" href=\"#machine-setup\">裝夾次數與拆件<\/a>、<a class=\"wl\" href=\"#hole-thread\">孔與螺紋<\/a>、<a class=\"wl\" href=\"#batch-size\">數量與開機成本<\/a>、<a class=\"wl\" href=\"#surface-finish\">表面處理<\/a>（各 2–3 份來源），圖 <code>tolerance-band<\/code>、<code>machine-setup<\/code>、<code>hole-thread<\/code>、<code>batch-size<\/code>。<\/li>\n<li>更新：<a class=\"wl\" href=\"#internal-corner-radius\">內角圓角與清角<\/a>、<a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a>、<a class=\"wl\" href=\"#thin-wall\">薄牆與細高特徵<\/a>、<a class=\"wl\" href=\"#machinability\">材料好不好切<\/a>、<a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>、<a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>、<a class=\"wl\" href=\"#todo\">待寫清單<\/a>。<\/li>\n<li><strong>找到矛盾<\/strong>：凹槽深度的「4 倍」，Hubs 寫成深度 ≤ 4 × XY 尺寸，Xometry 寫成長度 ≤ 4 × 深度，方向相反 → 兩個都照原文寫進 <a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a>，不自己選一個。<\/li>\n<li><strong>可信度<\/strong>：Xometry 是 Protolabs 集團以外的公司，內角圓角的「只有同一家」問題解決，從待辦移除。三家的標準公差換算後幾乎一樣（±0.125、±0.13、±0.127 mm）。<\/li>\n<li>分支判斷：EDM／線切割到 2 份，但這輪已新增 5 頁，留在待辦。<\/li>\n<li>第 1 次檢查失敗 1 項：log.md 沒有 xometry-cost-2020 的收錄紀錄；3 個警告：batch-size、hole-thread、surface-finish 沒有頁面連到 → 補紀錄，從 cnc-milling 的「規格怎麼讀」和導覽頁連過去。<\/li>\n<li>第 2 次檢查：\n<code>頁數：sources 3、parts 1、processes 1、concepts 9、cases 0\n健檢通過<\/code><\/li>\n<\/ul>\n<h2>2026-11-25 #4–#6 收錄 hubs-design-2026、hubs-cnc-basics-2026、iso2768-1989<\/h2>\n<p>這三份大多是「更新既有頁」，所以一起寫完來源頁，再跑一次檢查。（反思：一次三份，檢查失敗時比較難看出是哪一份造成的；之後還是一份一份來。）<\/p>\n<ul>\n<li>讀：<\/li>\n<li>hubs-design-2026：網頁全文文字（含規則表），沒看圖。<\/li>\n<li>hubs-cnc-basics-2026：網頁全文文字，沒看圖。<\/li>\n<li>iso2768-1989：標準全文（IS 2102 Part 1:1993 PDF，與 ISO 2768-1:1989 相同）。PDF 是掃描轉文字，表 1 已和同一份 PDF 的原始文字對過；表 2 的 v 級欄位不清楚，<strong>待核對<\/strong>。<\/li>\n<li>新增：<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>、<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>、<a class=\"wl\" href=\"#iso2768-1989\">一般公差標準 ISO 2768-1 1989<\/a>、<a class=\"wl\" href=\"#cnc-turning\">CNC 車削<\/a>（加工頁，1 份來源直接談）、<a class=\"wl\" href=\"#general-tolerance\">一般公差<\/a>（3 份來源）。<\/li>\n<li>更新：<a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>（補完「為什麼選它」：vs. 車削、3D 列印、板金、5 軸）、<a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a>、<a class=\"wl\" href=\"#internal-corner-radius\">內角圓角與清角<\/a>、<a class=\"wl\" href=\"#thin-wall\">薄牆與細高特徵<\/a>、<a class=\"wl\" href=\"#hole-thread\">孔與螺紋<\/a>、<a class=\"wl\" href=\"#tolerance\">公差<\/a>、<a class=\"wl\" href=\"#machine-setup\">裝夾次數與拆件<\/a>、<a class=\"wl\" href=\"#surface-finish\">表面處理<\/a>、<a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>（加總表與「不一致的地方」）、<a class=\"wl\" href=\"#todo\">待寫清單<\/a>。<\/li>\n<li><strong>找到矛盾<\/strong>：<\/li>\n<li>hubs-cnc-basics-2026 自己有三處數字前後不一致（銑床尺寸、最嚴公差、金屬牆厚）→ 全部寫進來源頁的「推論」，不採用其中一個。<\/li>\n<li>盲孔留多長不攻牙：Hubs 兩篇寫半個孔徑和 1.5 倍孔徑 → 兩個都寫，標出小螺紋照長的留比較保險是 Wiki 推論。<\/li>\n<li>「一般公差 ≈ ±0.125 mm」：ISO 2768 的公差隨尺寸改變，所以這只是近似 → 寫進 <a class=\"wl\" href=\"#general-tolerance\">一般公差<\/a>。<\/li>\n<li>分支判斷：5 軸出現在 2 份，但兩份都是 Hubs → 照第 7 節先不拆，寫在 <a class=\"wl\" href=\"#machine-setup\">裝夾次數與拆件<\/a>。文字刻字到 3 份，但對省錢篇是小項目，先放總表。<\/li>\n<li>第 1 次檢查失敗 8 項：<\/li>\n<li>3 項是「相關頁面」的原因太短（「銑削」「車削」「總表」不到 4 個字）→ 改成一句完整的原因。<\/li>\n<li>2 項是連到還沒建的頁（cnc-turning、general-tolerance）→ 建頁。<\/li>\n<li>3 項是 log 沒有紀錄 → 補這一筆。<\/li>\n<li>警告：hubs-cost-2026 被 16 頁連到 → 已經有導覽頁 cnc-cost-guide，在它開頭加 <code>hub: cnc-cost-guide<\/code>。<\/li>\n<li>第 2 次檢查失敗 3 項（只剩 log）；補完這一筆後：\n<code>頁數：sources 6、parts 1、processes 2、concepts 10、cases 0\n健檢通過<\/code><\/li>\n<\/ul>\n<h2>2026-11-25 #7 健檢（lint_report.py）<\/h2>\n<ul>\n<li>check.py 通過。<\/li>\n<li>單向連結 7 條 → 補了 6 條回連（surface-finish → machinability 那條原本就有了一半，一併補上）。<\/li>\n<li>「可能相關、卻互不相連」35 條：大部分是誤報。這個主題的來源都是「一份清單談十幾條規則」，所以幾乎每兩個概念頁都共用 2–3 份來源。<strong>這個規則在機械 Wiki 不太適用<\/strong>，先記下來，之後考慮改成「共用的來源排除總表型來源」或提高門檻（反思用）。<\/li>\n<li>待辦裡可拆的 3 項：都已寫明暫不拆的理由。<\/li>\n<\/ul>\n<h2>2026-11-25 #8 產出：CNC 省錢篇教學簡報（slides/cnc-cost）<\/h2>\n<ul>\n<li>只引用 Wiki 頁，20 頁（含 3 題測驗、參考資料）。<\/li>\n<li>第 1 次簡報檢查失敗 2 項：<\/li>\n<li>「CNC」在封面先出現、第 2 頁才解釋 → <strong>判斷是規則誤判<\/strong>：封面只有標題，下一頁就解釋。改 check_slides.py：封面不算第一次出現。<\/li>\n<li>「公差」在第 4 頁（四個成本來源）先出現、第 11 頁才解釋 → 第 4 頁改寫成「要求很精準的尺寸」。<\/li>\n<li>第 2 次：通過。<\/li>\n<\/ul>\n<h3>測試檢查器本身（在複本上故意塞錯）<\/h3>\n<p>第一次測試：塞了 6 個錯，<strong>只抓到 2 個<\/strong>。<\/p>\n<table>\n<thead>\n<tr>\n<th>塞的錯<\/th>\n<th>抓到了嗎<\/th>\n<th>為什麼沒抓到<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>簡報：清角 6.35 → 6.5 mm<\/td>\n<td>有<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>簡報：32 → 42 mm<\/td>\n<td>有<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>簡報：304 不鏽鋼 90 → 60 美元<\/td>\n<td>沒有<\/td>\n<td>引用頁別處有「60%」（鋁的導電度）<\/td>\n<\/tr>\n<tr>\n<td>簡報：拿掉「<strong>盲孔<\/strong>：」的解釋，但留著 define:盲孔<\/td>\n<td>沒有<\/td>\n<td>檢查器只看標記，不看內容<\/td>\n<\/tr>\n<tr>\n<td>Wiki：牆厚 0.8 → 0.9 mm<\/td>\n<td>沒有<\/td>\n<td>來源別處有「0.90 mm」（最小刻字寬度）<\/td>\n<\/tr>\n<tr>\n<td>Wiki：5–10 倍 → 5–12 倍<\/td>\n<td>沒有<\/td>\n<td>來源別處有「12 mm」<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>→ <strong>改檢查器<\/strong>（新檔 tools/numcheck.py，兩個檢查器共用）：數字要同數值、<strong>同單位<\/strong>，而且來源那一行要和主張那一行<strong>有共同的詞<\/strong>；define: 標記要真的有「<strong>名詞<\/strong>：」的解釋。<\/p>\n<p>改完後，正式的 Wiki 有 13 項、簡報有 9 項沒通過：<\/p>\n<ul>\n<li>真的有問題：<a class=\"wl\" href=\"#batch-size\">數量與開機成本<\/a> 的煮湯比喻用了編的數字（1 件、100 件）卻沒寫「示意」→ 補上；<a class=\"wl\" href=\"#end-mill\">端銑刀<\/a> 的「ø8 mm」和來源的句子沒有共同的詞 → 改寫成來源的原意（8 mm 的刀配 5 mm 以上圓角）。<\/li>\n<li>規則誤判：來源表格裡的數字沒寫單位（單位在表名或表頭）→ 規則改成：表格裡沒單位的數字可以對上任何單位。測驗的錯誤選項本來就是編的 → 不檢查選項；解說裡自己算的寫「算術」。<\/li>\n<\/ul>\n<p>第二次測試（同樣 6 個錯）：<strong>抓到 5 個<\/strong>，還多抓到 1 個：簡報的「5–10 倍」因為 Wiki 頁被改成 12，對不上了（改了 Wiki 卻沒改簡報，也會被抓到）。<\/p>\n<ul>\n<li>還是漏掉「0.9 mm」：來源真的有一句「金屬 0.90 mm、塑膠 0.51 mm」（最小刻字寬度），數值、單位、用詞都一樣。這是純文字比對的極限，<strong>記下來，不為了測驗硬改規則<\/strong>；最後仍要人工讀過。<\/li>\n<\/ul>\n<p>檢查器輸出（第二次測試）：\n```\n共 20 頁\n簡報檢查失敗，共 5 個問題：\n - 第 7 頁（corner2）：數字 6.5mm 在引用的頁面 ['internal-corner-radius'] 裡找不到（要同數值、同單位、同一句有相同的詞）\n - 第 7 頁（corner2）：數字 42mm 在引用的頁面 ['internal-corner-radius'] 裡找不到（要同數值、同單位、同一句有相同的詞）\n - 第 10 頁（hole）：標了 define:盲孔，但這頁沒有「<strong>盲孔<\/strong>：⋯」的解釋\n - 第 14 頁（material）：數字 60 在引用的頁面 ['machinability'] 裡找不到（要同數值、同單位、同一句有相同的詞）\n - 第 15 頁（finish）：數字 10倍 在引用的頁面 ['surface-finish', 'batch-size'] 裡找不到（要同數值、同單位、同一句有相同的詞）<\/p>\n<p>健檢失敗，共 1 個問題：\n - wiki/concepts/batch-size.md：數字 12倍 在它引用的來源頁 ['hubs-cost-2026', 'xometry-cost-2020'] 裡找不到（要同數值、同單位、同一句有相同的詞）：- <strong>一次多訂<\/strong>：從 1 件加到 5 件，單價約減半；1,000 件以上，單價可降 5–12 倍\n```<\/p>\n<h2>2026-11-25 #9 發布前實際看一眼（桌面 1366 寬、手機 390 寬截圖）<\/h2>\n<ul>\n<li>手機版 Wiki 的導覽頁整頁可以左右滑動 → 找到原因：頁尾「連到這一頁的頁面」的連結設成不換行，長標題撐出畫面 → 改成可以換行。<\/li>\n<li>圓角圖的第 ③ 格（清角）畫錯了：U 形缺口畫在牆外、方形零件的角沒有伸進去 → 重畫成以角落為圓心的缺口，方形的角真的塞到底；另一個說明文字壓到標題，刪掉。<\/li>\n<li>測驗第 2 題的正確選項寫了「孔徑的 3 倍」，等於把答案講出來 → 拿掉括號。<\/li>\n<li>重新截圖：沒有頁面溢出，主控台沒有錯誤。<\/li>\n<li>簡報與 Wiki 都重新跑過檢查並通過（build_site.py 先檢查才產生）。<\/li>\n<\/ul>\n<h2>2026-11-27 #10 提問：盲孔底部為什麼不攻牙<\/h2>\n<ul>\n<li>Wiki 只有規則（Hubs 兩篇），沒有來源解釋原因。<\/li>\n<li><strong>發現錯誤<\/strong>：<a class=\"wl\" href=\"#hole-thread\">孔與螺紋<\/a> 寫了「鐵屑出不去、絲攻攻到底會卡」「讓絲攻有空間」，沒有任何來源，也沒標成推論（check.py 抓不到，因為句子裡沒有數字）→ 改標成 Wiki 推論，記進 <a class=\"wl\" href=\"#todo\">待寫清單<\/a> 等來源。<\/li>\n<li>使用者提供 RapidDirect〈CNC 加工設計指南〉。網頁沒有讀到（讀取需要核准，當時沒人回應），只看到搜尋摘要，還沒收錄。<\/li>\n<\/ul>\n<h2>2026-11-27 #11 收錄 rapiddirect-threads-2022（RapidDirect〈Threaded holes〉）<\/h2>\n<ul>\n<li>起因：使用者問「盲孔底部為什麼不攻牙」（#10），Wiki 只有規則沒有原因。<\/li>\n<li>讀：英文版網頁全文文字；簡中版〈螺纹孔〉網址讀取失敗，是同一篇的翻譯。沒有看圖。<\/li>\n<li>新增：<a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>、<a class=\"wl\" href=\"#tap\">絲攻<\/a>（零件頁；3 份來源談到絲攻）、圖 <code>tap-lead<\/code>（三種絲攻的尖端＋盲孔的三段）。<\/li>\n<li>更新：<a class=\"wl\" href=\"#hole-thread\">孔與螺紋<\/a>（盲孔底部留不攻牙的三個原因：絲攻尖端、鑽頭錐形有來源，切屑標成推論）、<a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>、<a class=\"wl\" href=\"#todo\">待寫清單<\/a>。<\/li>\n<li><strong>找到矛盾<\/strong>：原文說先攻有 6 到 7 個切削齒，又說前 10 牙可能沒成形 → 兩個都照原文記。<\/li>\n<li><strong>可信度<\/strong>：這篇沒有直接講「底部留半個孔徑」的規則；把它的說明和 Hubs 的規則接起來是 Wiki 推論，已寫進來源頁。<\/li>\n<li>第 1 次檢查失敗 1 項：log.md 沒有紀錄 → 補這一筆。<\/li>\n<\/ul>\n<h2>2026-11-27 #12 使用者看不懂清角的圖<\/h2>\n<ul>\n<li>卡住的地方：圓角圖第 ③ 格只畫了「加清角」，沒畫「不加會怎樣」，看不出清角在解決什麼問題。這也是核心問題「解決什麼問題」沒畫出來。<\/li>\n<li>修改：新圖 <code>corner-relief<\/code>（左右對照：只有圓角時方形零件卡住、留縫；加清角後塞到底）；舊圖 <code>corner-radius<\/code> 拿掉第 ③ 格；<a class=\"wl\" href=\"#internal-corner-radius\">內角圓角與清角<\/a> 加抽屜比喻；簡報在規則 1 後加一頁（共 21 頁）；<a class=\"wl\" href=\"#me\">我的程度<\/a> 記下卡住的地方與「圖要並排畫出錯的做法」這個偏好。<\/li>\n<\/ul>", "back": [], "maybe": []}, "me": {"title": "我的程度", "type": "overview", "updated": "2026-11-25", "html": "<p>這一頁記錄使用者已經懂什麼、卡在哪裡。<strong>AI 解釋任何新知識之前，都要先讀這一頁<\/strong>（AGENTS.md 第 11 節）。<\/p>\n<ul>\n<li>「已經懂」只放使用者親口確認過的。<\/li>\n<li>AI 推測的一律放「可能懂」，寫出根據，等使用者確認。<\/li>\n<li>使用者說「太快了」「看不懂」，就移到「卡住過」，記下卡在哪裡。<\/li>\n<\/ul>\n<h2>已經懂（你確認過的）<\/h2>\n<p>（還沒有）<\/p>\n<h2>可能懂（AI 推測，待確認）<\/h2>\n<table>\n<thead>\n<tr>\n<th>概念<\/th>\n<th>推測的根據<\/th>\n<th>Wiki 頁<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>螺絲規格的寫法（例如 M6x40）<\/td>\n<td>平常會整理五金袋，記錄 M6x40 這類規格<\/td>\n<td>尚無<\/td>\n<\/tr>\n<tr>\n<td>認得常見的機械、電氣零件外觀<\/td>\n<td>平常會拍零件照片做庫存盤點<\/td>\n<td>尚無<\/td>\n<\/tr>\n<tr>\n<td>領料流程、料號<\/td>\n<td>平常會填領料單<\/td>\n<td>尚無<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>卡住過（看不懂的地方）<\/h2>\n<table>\n<thead>\n<tr>\n<th>日期<\/th>\n<th>卡在哪<\/th>\n<th>後來有效的講法<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2026-11-27<\/td>\n<td>圓角圖的第 ③ 格「清角」看不懂：原圖只畫了清角，沒畫「沒有清角會卡在哪」<\/td>\n<td>抽屜比喻（圓角抽屜放不進方盒子）＋左右對照圖（卡住 vs. 塞到底）。還沒確認懂了沒<\/td>\n<\/tr>\n<tr>\n<td>2026-11-27<\/td>\n<td>問「盲孔底部為什麼不攻牙」<\/td>\n<td>絲攻像削過的鉛筆，尖端切不完整；配三支絲攻＋盲孔三段的圖。還沒確認懂了沒<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>想學的<\/h2>\n<ul>\n<li>板金加工、零件、車床，範圍很廣，慢慢維護（2026-11-25 自己說的）。<\/li>\n<li>第一個主題：CNC 加工怎麼省錢（從 Hubs 的 14 招開始）。<\/li>\n<\/ul>\n<h2>解釋方式偏好<\/h2>\n<ul>\n<li><strong>背景比較淺<\/strong>（2026-11-25 自己說的）：術語第一次出現一定要先解釋。<\/li>\n<li><strong>能配圖就配圖<\/strong>：形狀、方向、深度這類東西，先給圖再講。<\/li>\n<li><strong>圖要畫出「不這樣做會怎樣」<\/strong>：只畫正確做法看不懂，要和錯的做法並排對照（2026-11-27 清角的教訓）。<\/li>\n<li>先比喻，再術語；講完問「卡在哪一塊」。<\/li>\n<li>用繁體中文。<\/li>\n<\/ul>", "back": [], "maybe": []}, "end-mill": {"title": "端銑刀", "type": "part", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>銑床上最常用的刀：像一根有刃的圓棒，側面和底部都能切。<\/p>\n<h2>解決什麼問題<\/h2>\n<p>要在一塊料上挖出凹槽、切出輪廓，需要一把一邊旋轉、一邊往旁邊推也能切的刀。鑽頭只能往下鑽圓孔，端銑刀的側面也有刃，所以能「橫著走」。<\/p>\n<h2>怎麼運作<\/h2>\n<p>刀高速旋轉，側面的刃把材料一點點削掉。因為刀是圓柱形，<strong>它切出來的內角一定是圓的<\/strong>，圓角半徑最小就等於刀的半徑：0.8 mm 的刀會在角落留下 0.4 mm 的圓角（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/p>\n<p>刀底部是平的叫平刀；底部是半球形的叫<strong>球刀<\/strong>，用來切曲面、倒圓角，也用來刻字（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>大刀 vs. 小刀<\/strong>：大刀每一圈削掉的材料多，切得快；小刀要走更多趟、轉速也要放慢，所以設計允許的話，盡量讓工廠能用大刀（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 1 招、<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/li>\n<li><strong>短刀 vs. 長刀<\/strong>：刀伸得越長越容易晃。刀最好的工作深度約是直徑的 2–3 倍（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 2 招）；很小的刀，長度大約只能到直徑的 5 倍（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/li>\n<\/ul>\n<h2>規格怎麼讀<\/h2>\n<ul>\n<li><strong>直徑<\/strong>：例如 8 mm 的刀，配上 5 mm 以上的圓角就能切得快（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 1 招）；12 mm 的端銑刀大約可以切到 25 mm 深（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 2 招）。<\/li>\n<li><strong>平刀／球刀<\/strong>：看刀尖形狀。<\/li>\n<li>刀的長度、刃數、材質（例如超硬合金）也是規格，這兩份來源沒有談，先不寫。<\/li>\n<\/ul>\n<h2>出問題怎麼認<\/h2>\n<ul>\n<li>刀太細、伸太長：切的時候會晃，尺寸不準，嚴重時刀會斷（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a> 談到小刀與深槽的限制）。<\/li>\n<li>圖面畫了尖的內角：收到的零件角落一定是圓的，這是刀的形狀造成的，不是做錯。<\/li>\n<\/ul>\n<h2>證據<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>：大刀切得快；工作深度約 2–3 倍直徑；12 mm 刀約可切 25 mm 深。<\/li>\n<li><a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>：0.8 mm 刀留 0.4 mm 圓角；小刀長度約 5 倍直徑；球刀用來刻字與去毛邊。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#internal-corner-radius\">內角圓角與清角<\/a>：刀是圓的，所以內角一定有圓角<\/li>\n<li><a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a>：刀的長度決定槽能挖多深<\/li>\n<li><a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>：端銑刀用在哪種加工<\/li>\n<li><a class=\"wl\" href=\"#thin-wall\">薄牆與細高特徵<\/a>：刀會晃、薄牆也會晃，兩者疊加更難做<\/li>\n<li><a class=\"wl\" href=\"#hole-thread\">孔與螺紋<\/a>：非標準孔徑要用端銑刀慢慢修<\/li>\n<\/ul>", "back": ["cavity-depth", "cnc-cost-guide", "cnc-milling", "hole-thread", "internal-corner-radius", "tap", "thin-wall"], "maybe": ["tolerance", "machine-setup", "machinability"]}, "tap": {"title": "絲攻", "type": "part", "updated": "2026-11-27", "html": "<h2>一句話<\/h2>\n<p>在孔壁上切出內螺紋的刀，前端像削過的鉛筆一樣變細，所以尖端那幾牙切不完整。<\/p>\n<h2>解決什麼問題<\/h2>\n<p>螺絲要鎖進一塊板子，又不想在背面加螺帽，就要在板子的孔裡直接做出螺紋。絲攻就是做這件事的刀，這個動作叫<strong>攻牙<\/strong>。<\/p>\n<h2>怎麼運作<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 360\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"示意圖：左邊三支絲攻，先攻的尖端削尖得最長，後攻最短；右邊是盲孔，絲攻尖端那段切出的牙不完整，所以孔要比完整螺紋更深\">\n<text x=\"20\" y=\"28\" class=\"f-h\">絲攻的尖端是削尖的<\/text>\n<g>\n<text x=\"40\" y=\"62\" class=\"f-lab\">先攻<\/text>\n<path d=\"M45,80 L75,80 L75,215 L66,300 L54,300 L45,215 Z\" class=\"f-out\"/>\n<path d=\"M45,95 l30,8 M45,115 l30,8 M45,135 l30,8 M45,155 l30,8 M45,175 l30,8 M45,195 l30,8\" class=\"f-s\"/>\n<path d=\"M45,215 L54,300 L66,300 L75,215 Z\" class=\"f-hold\"/>\n<text x=\"20\" y=\"325\" class=\"f-note\">尖端長，好咬進去<\/text>\n<text x=\"140\" y=\"62\" class=\"f-lab\">中攻<\/text>\n<path d=\"M145,80 L175,80 L175,255 L168,300 L152,300 L145,255 Z\" class=\"f-out\"/>\n<path d=\"M145,95 l30,8 M145,115 l30,8 M145,135 l30,8 M145,155 l30,8 M145,175 l30,8 M145,195 l30,8 M145,215 l30,8 M145,235 l30,8\" class=\"f-s\"/>\n<path d=\"M145,255 L152,300 L168,300 L175,255 Z\" class=\"f-hold\"/>\n<text x=\"240\" y=\"62\" class=\"f-lab\">後攻<\/text>\n<path d=\"M245,80 L275,80 L275,285 L271,300 L249,300 L245,285 Z\" class=\"f-out\"/>\n<path d=\"M245,95 l30,8 M245,115 l30,8 M245,135 l30,8 M245,155 l30,8 M245,175 l30,8 M245,195 l30,8 M245,215 l30,8 M245,235 l30,8 M245,255 l30,8\" class=\"f-s\"/>\n<path d=\"M245,285 L249,300 L271,300 L275,285 Z\" class=\"f-hold\"/>\n<text x=\"215\" y=\"325\" class=\"f-note\">尖端短，牙做得到孔底<\/text>\n<\/g>\n<text x=\"20\" y=\"348\" class=\"f-note\">黃色：削尖的那一段，切出來的牙不完整<\/text>\n<line x1=\"345\" y1=\"45\" x2=\"345\" y2=\"335\" class=\"f-zero\"/>\n<text x=\"380\" y=\"62\" class=\"f-lab\">為什麼盲孔要鑽深一點<\/text>\n<path d=\"M380,80 L490,80 L490,285 L510,307 L530,285 L530,80 L640,80 L640,330 L380,330 Z\" class=\"f-out\"/>\n<path d=\"M490,95 l40,10 M490,115 l40,10 M490,135 l40,10 M490,155 l40,10 M490,175 l40,10 M490,195 l40,10\" class=\"f-s\"/>\n<path d=\"M490,215 l40,6 M490,235 l40,4\" class=\"f-s\" opacity=\".55\"/>\n<rect x=\"490\" y=\"212\" width=\"40\" height=\"38\" class=\"f-hold\"/>\n<line x1=\"655\" y1=\"80\" x2=\"655\" y2=\"210\" class=\"f-a\"/><line x1=\"647\" y1=\"80\" x2=\"663\" y2=\"80\" class=\"f-a\"/><line x1=\"647\" y1=\"210\" x2=\"663\" y2=\"210\" class=\"f-a\"/>\n<text x=\"668\" y=\"140\" class=\"f-lab\">完整的牙<\/text>\n<text x=\"668\" y=\"158\" class=\"f-lab\">（真正出力）<\/text>\n<text x=\"668\" y=\"228\" class=\"f-lab\">絲攻尖端：<\/text>\n<text x=\"668\" y=\"246\" class=\"f-lab\">牙不完整<\/text>\n<text x=\"668\" y=\"292\" class=\"f-lab\">鑽頭的錐形<\/text>\n<text x=\"668\" y=\"310\" class=\"f-lab\">攻不到牙<\/text>\n<text x=\"380\" y=\"352\" class=\"f-note\">示意，非真實尺寸<\/text>\n<\/svg>\n<\/figure>\n<ol>\n<li>先用鑽頭鑽一個比螺絲小一點的<strong>底孔<\/strong>，孔口倒角，讓絲攻和螺絲比較好對正（<a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>）。<\/li>\n<li>絲攻轉進孔裡，刃把孔壁切出螺旋狀的牙。手工攻牙時，每順時針轉一圈就逆時針退半圈，不讓切屑堆積（<a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>）。<\/li>\n<li><strong>絲攻的前端是削尖的<\/strong>：最前面幾牙比較細，只切淺淺一點，越往後才切到完整的深度。這樣它才咬得進去，但也代表尖端那段切出來的牙不完整。<\/li>\n<\/ol>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>先攻、中攻、後攻<\/strong>：差在尖端削尖的長度。先攻從尖端開始有 6 到 7 個逐漸變細的切削齒，好咬進去、適合硬材料和盲孔，但不建議用它把牙做完，因為前面 10 牙可能沒完全成形；後攻開頭只有 1 到 2 個切削齒，可以把牙做到接近孔底。所以常照先攻、中攻、後攻的順序輪流用（<a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>）。<\/li>\n<li><strong>切削絲攻 vs. 擠壓絲攻<\/strong>：擠壓絲攻把材料擠成牙，不會產生切屑，適合鋁、黃銅這類軟材料（<a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>）。<\/li>\n<li><strong>攻牙 vs. 螺紋刀<\/strong>：很小的螺紋用絲攻，絲攻可以做到 M2；CNC 的螺紋刀一般做到 M6（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>）。<\/li>\n<\/ul>\n<h2>規格怎麼讀<\/h2>\n<ul>\n<li>絲攻上會刻螺紋規格，例如「M6×1.00」：公制、直徑 6 mm、螺距 1.00 mm（<a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>）。<\/li>\n<li>選標準的絲攻尺寸，不要用少見的規格（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a> 第 5 招）。<\/li>\n<li>底孔要比螺絲直徑小多少，要查攻牙底孔表，目前的來源沒有給，記進 <a class=\"wl\" href=\"#todo\">待寫清單<\/a>。<\/li>\n<\/ul>\n<h2>出問題怎麼認<\/h2>\n<ul>\n<li><strong>絲攻斷在孔裡<\/strong>：攻太深最容易斷（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）；在工件邊緣、斜面上攻牙，或刀已經損壞，也容易滑掉或斷掉（<a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>）。<\/li>\n<li><strong>孔底那段牙不完整<\/strong>：螺絲鎖到底卻鎖不緊，可能是孔不夠深、整段都只用先攻做（Wiki 推論，見 <a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a> 的「原文與推論」）。<\/li>\n<\/ul>\n<h2>證據<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>：攻牙步驟、三種絲攻的齒數與用途、轉一圈退半圈、擠壓絲攻、斷絲攻的情況。<\/li>\n<li><a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>：攻太深絲攻容易斷；用標準絲攻尺寸。<\/li>\n<li><a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>：絲攻可做到 M2、CNC 螺紋刀到 M6。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#hole-thread\">孔與螺紋<\/a>：螺紋要攻多深、盲孔底部為什麼要留一段<\/li>\n<li><a class=\"wl\" href=\"#end-mill\">端銑刀<\/a>：另一種刀，用在銑削<\/li>\n<li><a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>：絲攻的主要來源<\/li>\n<\/ul>", "back": ["cnc-cost-guide", "hole-thread", "rapiddirect-threads-2022"], "maybe": ["tolerance", "thin-wall", "machine-setup", "internal-corner-radius", "cnc-milling"]}, "cnc-milling": {"title": "CNC 銑削", "type": "process", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>刀子轉、工件不動，用圓柱形的刀把一塊方料一層層挖成想要的形狀。<\/p>\n<h2>解決什麼問題<\/h2>\n<p>要做一個有平面、凹槽、孔的金屬或塑膠零件，數量又不多。手工做不準，開模又太貴，銑削可以直接從一塊料切出來。<\/p>\n<p><strong>CNC<\/strong> 是「電腦數值控制」：刀子怎麼走，由電腦照程式控制，不是人手搖。<\/p>\n<h2>怎麼做<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"示意圖：左邊是銑削，刀子在轉、工件不動；右邊是車削，工件在轉、刀子不轉\">\n<defs><marker id=\"mvt-ar\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"f-ka\"/><\/marker><\/defs>\n<text x=\"40\" y=\"30\" class=\"f-h\">銑削（milling）：刀子轉，工件不動<\/text>\n<rect x=\"70\" y=\"170\" width=\"250\" height=\"90\" class=\"f-out\"/>\n<path d=\"M150,170 L150,205 L240,205 L240,170\" class=\"f-hold\"/>\n<rect x=\"175\" y=\"70\" width=\"40\" height=\"115\" rx=\"4\" class=\"f-in\"/>\n<line x1=\"186\" y1=\"78\" x2=\"204\" y2=\"98\" class=\"f-s\"/><line x1=\"186\" y1=\"102\" x2=\"204\" y2=\"122\" class=\"f-s\"/><line x1=\"186\" y1=\"126\" x2=\"204\" y2=\"146\" class=\"f-s\"/><line x1=\"186\" y1=\"150\" x2=\"204\" y2=\"170\" class=\"f-s\"/>\n<path d=\"M160,62 A36,12 0 1,0 232,62\" class=\"f-a\" marker-end=\"url(#mvt-ar)\"/>\n<text x=\"245\" y=\"66\" class=\"f-lab\">刀高速旋轉<\/text>\n<text x=\"245\" y=\"130\" class=\"f-lab\">刀往下、往旁邊移動<\/text>\n<text x=\"245\" y=\"148\" class=\"f-lab\">把材料一層層挖掉<\/text>\n<text x=\"85\" y=\"285\" class=\"f-lab\">工件（方料）夾在機台上，不動<\/text>\n<line x1=\"380\" y1=\"40\" x2=\"380\" y2=\"300\" class=\"f-zero\"/>\n<text x=\"410\" y=\"30\" class=\"f-h\">車削（turning）：工件轉，刀子不轉<\/text>\n<rect x=\"440\" y=\"150\" width=\"250\" height=\"70\" rx=\"6\" class=\"f-out\"/>\n<ellipse cx=\"440\" cy=\"185\" rx=\"12\" ry=\"35\" class=\"f-out\"/>\n<path d=\"M425,120 A14,40 0 1,1 425,250\" class=\"f-a\" marker-end=\"url(#mvt-ar)\"/>\n<text x=\"410\" y=\"112\" class=\"f-lab\">工件高速旋轉<\/text>\n<path d=\"M600,280 L585,222 L615,222 Z\" class=\"f-in\"/>\n<rect x=\"590\" y=\"280\" width=\"20\" height=\"30\" class=\"f-in\"/>\n<text x=\"625\" y=\"262\" class=\"f-lab\">車刀不轉，<\/text>\n<text x=\"625\" y=\"280\" class=\"f-lab\">只左右、前後移動<\/text>\n<text x=\"440\" y=\"246\" class=\"f-lab\">適合圓的零件：軸、套筒<\/text>\n<text x=\"40\" y=\"322\" class=\"f-note\">示意，非真實尺寸<\/text>\n<\/svg>\n<\/figure>\n<ol>\n<li>把一塊比成品大一點的方料（叫<strong>毛胚<\/strong>）夾在機台上。<\/li>\n<li>刀子高速旋轉，沿著電腦算好的路徑移動，一層層切掉不要的材料。<\/li>\n<li>一面做完，如果另一面也有形狀，就要把工件拆下來翻面再夾一次（<a class=\"wl\" href=\"#machine-setup\">裝夾次數與拆件<\/a>）。<\/li>\n<\/ol>\n<p>電腦怎麼知道刀要怎麼走？設計好的 3D 模型（CAD）會轉成機器看得懂的指令 G-code（<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>）。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li>銑削的成本從哪裡來：加工時間、開機成本、難做的形狀、材料（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）。加工時間常常是最大的一項（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）。<\/li>\n<li><strong>銑削 vs. 車削<\/strong>：圓的、旋轉對稱的零件用車削比較順；其他形狀用銑削（<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>，見 <a class=\"wl\" href=\"#cnc-turning\">CNC 車削<\/a>）。<\/li>\n<li><strong>銑削 vs. 3D 列印<\/strong>：銑削精度高、零件保有原料的強度；但開機成本比較高，一般交期約 10 天，3D 列印約 2–5 天（<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>）。<\/li>\n<li><strong>適合的量<\/strong>：從 1 件打樣到約 1,000 件都很有效率（<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>）；Xometry 說 10,000 件以內最划算（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）。<\/li>\n<li><strong>銑削 vs. 板金<\/strong>：牆很薄的零件，改用板金通常比較划算（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）。<\/li>\n<li><strong>3 軸 vs. 5 軸<\/strong>：3 軸的刀只能從上面垂直下來；5 軸多了兩個旋轉方向，能少翻面、做複雜形狀，但比較貴（<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>、<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>）。<\/li>\n<\/ul>\n<h2>規格怎麼讀<\/h2>\n<p>圖面上跟銑削成本最有關的幾個數字，每一項都有自己的頁：<\/p>\n<ul>\n<li>內角的圓角半徑：<a class=\"wl\" href=\"#internal-corner-radius\">內角圓角與清角<\/a><\/li>\n<li>凹槽深度：<a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a><\/li>\n<li>牆厚：<a class=\"wl\" href=\"#thin-wall\">薄牆與細高特徵<\/a><\/li>\n<li>材料：<a class=\"wl\" href=\"#machinability\">材料好不好切<\/a><\/li>\n<li>孔徑與螺紋長度：<a class=\"wl\" href=\"#hole-thread\">孔與螺紋<\/a><\/li>\n<li>公差：<a class=\"wl\" href=\"#tolerance\">公差<\/a><\/li>\n<li>要翻面幾次：<a class=\"wl\" href=\"#machine-setup\">裝夾次數與拆件<\/a><\/li>\n<li>表面處理：<a class=\"wl\" href=\"#surface-finish\">表面處理<\/a><\/li>\n<li>訂幾件：<a class=\"wl\" href=\"#batch-size\">數量與開機成本<\/a><\/li>\n<\/ul>\n<h2>出問題怎麼認<\/h2>\n<ul>\n<li>牆太薄：切的時候變形或斷掉（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 3 招）。<\/li>\n<li>細高的特徵：切的時候會振動，尺寸做不準（第 8 招）。<\/li>\n<li>深槽、深牆：原料的殘留應力釋放，零件切完會走樣（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/li>\n<li>圖面畫尖的內角：收到的零件角落是圓的，這是刀的形狀，不是做錯（<a class=\"wl\" href=\"#internal-corner-radius\">內角圓角與清角<\/a>）。<\/li>\n<\/ul>\n<h2>證據<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>：14 招的成本規則，幾乎都是針對銑削。<\/li>\n<li><a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>：加工廠自己寫的六招，重點在清角、薄牆、材料替代。<\/li>\n<li><a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>：另一家公司的十招，和前兩份大致一致，多談了孔與攻牙。<\/li>\n<li><a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>：每條規則的建議值與勉強可做的值。<\/li>\n<li><a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>：銑削、車削、3 軸、5 軸的入門說明。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>：銑削為什麼貴、怎麼省<\/li>\n<li><a class=\"wl\" href=\"#cnc-turning\">CNC 車削<\/a>：另一種 CNC，差在誰在轉<\/li>\n<li><a class=\"wl\" href=\"#end-mill\">端銑刀<\/a>：銑削用的刀<\/li>\n<li><a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>：CNC 省錢篇的閱讀順序<\/li>\n<\/ul>", "back": ["cnc-cost-guide", "cnc-turning", "end-mill", "hole-thread", "hubs-cnc-basics-2026", "hubs-cost-2026", "machinability", "machine-setup"], "maybe": ["tap", "general-tolerance"]}, "cnc-turning": {"title": "CNC 車削", "type": "process", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>工件轉、刀子不轉，像削蘋果皮一樣，把一根圓棒車成軸、套筒這類圓的零件。<\/p>\n<h2>解決什麼問題<\/h2>\n<p>很多機械零件是圓的：軸、銷、套筒、滾輪。用銑床做圓柱很不順手，車削讓工件自己轉，刀只要貼著它前後、左右移動，就能車出精準的圓。<\/p>\n<h2>怎麼做<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"示意圖：左邊是銑削，刀子在轉、工件不動；右邊是車削，工件在轉、刀子不轉\">\n<defs><marker id=\"mvt-ar\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"f-ka\"/><\/marker><\/defs>\n<text x=\"40\" y=\"30\" class=\"f-h\">銑削（milling）：刀子轉，工件不動<\/text>\n<rect x=\"70\" y=\"170\" width=\"250\" height=\"90\" class=\"f-out\"/>\n<path d=\"M150,170 L150,205 L240,205 L240,170\" class=\"f-hold\"/>\n<rect x=\"175\" y=\"70\" width=\"40\" height=\"115\" rx=\"4\" class=\"f-in\"/>\n<line x1=\"186\" y1=\"78\" x2=\"204\" y2=\"98\" class=\"f-s\"/><line x1=\"186\" y1=\"102\" x2=\"204\" y2=\"122\" class=\"f-s\"/><line x1=\"186\" y1=\"126\" x2=\"204\" y2=\"146\" class=\"f-s\"/><line x1=\"186\" y1=\"150\" x2=\"204\" y2=\"170\" class=\"f-s\"/>\n<path d=\"M160,62 A36,12 0 1,0 232,62\" class=\"f-a\" marker-end=\"url(#mvt-ar)\"/>\n<text x=\"245\" y=\"66\" class=\"f-lab\">刀高速旋轉<\/text>\n<text x=\"245\" y=\"130\" class=\"f-lab\">刀往下、往旁邊移動<\/text>\n<text x=\"245\" y=\"148\" class=\"f-lab\">把材料一層層挖掉<\/text>\n<text x=\"85\" y=\"285\" class=\"f-lab\">工件（方料）夾在機台上，不動<\/text>\n<line x1=\"380\" y1=\"40\" x2=\"380\" y2=\"300\" class=\"f-zero\"/>\n<text x=\"410\" y=\"30\" class=\"f-h\">車削（turning）：工件轉，刀子不轉<\/text>\n<rect x=\"440\" y=\"150\" width=\"250\" height=\"70\" rx=\"6\" class=\"f-out\"/>\n<ellipse cx=\"440\" cy=\"185\" rx=\"12\" ry=\"35\" class=\"f-out\"/>\n<path d=\"M425,120 A14,40 0 1,1 425,250\" class=\"f-a\" marker-end=\"url(#mvt-ar)\"/>\n<text x=\"410\" y=\"112\" class=\"f-lab\">工件高速旋轉<\/text>\n<path d=\"M600,280 L585,222 L615,222 Z\" class=\"f-in\"/>\n<rect x=\"590\" y=\"280\" width=\"20\" height=\"30\" class=\"f-in\"/>\n<text x=\"625\" y=\"262\" class=\"f-lab\">車刀不轉，<\/text>\n<text x=\"625\" y=\"280\" class=\"f-lab\">只左右、前後移動<\/text>\n<text x=\"440\" y=\"246\" class=\"f-lab\">適合圓的零件：軸、套筒<\/text>\n<text x=\"40\" y=\"322\" class=\"f-note\">示意，非真實尺寸<\/text>\n<\/svg>\n<\/figure>\n<ol>\n<li>把圓棒料夾在會轉的夾頭上。<\/li>\n<li>工件高速旋轉，固定的車刀靠上去，一圈一圈把外徑車小、車出階梯、溝槽或螺紋。<\/li>\n<li>多軸的車削中心還可以加上旋轉的刀，在同一台機器上做銑削（<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>）。<\/li>\n<\/ol>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>車削 vs. 銑削<\/strong>：零件有旋轉對稱（例如圓柱）就用車削；其他形狀用銑削（<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>，見 <a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>）。<\/li>\n<li><strong>表面比較光<\/strong>：原文給的典型表面粗糙度，車削件約 0.8 µm，銑削件約 3.2 µm（<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>，見 <a class=\"wl\" href=\"#surface-finish\">表面處理<\/a>）。<\/li>\n<li>尺寸上限：車削最大直徑約 500 mm（<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>）。<\/li>\n<\/ul>\n<h2>規格怎麼讀<\/h2>\n<ul>\n<li>圖面上常見 <strong>ø<\/strong>（直徑）符號，例如 ø20：直徑 20 mm（示意）。<\/li>\n<li>車削件的其他規格（螺紋、倒角、溝槽）這份來源沒有談，等收錄車床的資料再補（見 <a class=\"wl\" href=\"#todo\">待寫清單<\/a>）。<\/li>\n<\/ul>\n<h2>出問題怎麼認<\/h2>\n<p>這份資料沒有談車削的常見問題，等收錄車床的資料再補。<\/p>\n<h2>證據<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>：車削的定義、適合的形狀、最大直徑、表面粗糙度。目前只有這一份入門來源。<\/li>\n<\/ul>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>：另一種主要的 CNC 加工，差在誰在轉<\/li>\n<li><a class=\"wl\" href=\"#surface-finish\">表面處理<\/a>：車削件的表面通常比較光<\/li>\n<li><a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>：入門來源<\/li>\n<\/ul>", "back": ["cnc-cost-guide", "cnc-milling", "hubs-cnc-basics-2026", "surface-finish"], "maybe": []}, "hubs-cnc-basics-2026": {"title": "什麼是 CNC 加工（Protolabs Network／Hubs）", "type": "source", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>CNC 是從一塊實心料切掉不要的部分；銑削是刀轉，車削是工件轉。<\/p>\n<h2>資料是什麼<\/h2>\n<p>Protolabs Network（Hubs）知識庫的入門文章〈What is CNC machining?〉，寫給第一次接觸 CNC 的人。和 <a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a> 是同一家公司。性質是<strong>廠商入門文章<\/strong>。網頁沒有作者和日期，頁尾寫 2026 年版權。<\/p>\n<h2>重點<\/h2>\n<ul>\n<li><strong>CNC 是「減法」製造<\/strong>：從一塊實心料切掉材料，照 CAD 模型做出零件；模型會轉成 G-code（機器看得懂的指令）來控制刀具路徑。<\/li>\n<li><strong>銑削<\/strong>：旋轉的刀切削固定在機台上的工件。多數機器有 X、Y、Z 三個直線軸；5 軸機多了旋轉，能做複雜形狀、減少翻面。<\/li>\n<li><strong>車削<\/strong>：工件旋轉，固定的刀切削它，適合有旋轉對稱的零件，例如圓柱形的零件。多軸車削中心也能加上銑削。<\/li>\n<li><strong>3 軸 vs. 5 軸<\/strong>：3 軸的刀從上面垂直下來，有些面要把工件重新擺放才碰得到；5 軸可以同時沿多軸移動。<\/li>\n<li><strong>尺寸與公差<\/strong>：銑床最大約 2,000 × 800 × 1,000 mm；車削最大直徑約 500 mm。沒標公差時照 ISO 2768，原文說大約 ±0.125 mm。<\/li>\n<li><strong>最小牆厚<\/strong>：塑膠 1.5 mm；金屬在內文寫 0.8 mm，在表格寫 0.75 mm。<\/li>\n<li><strong>優點<\/strong>：精度高、重複性好；零件保有原料各方向一致的強度；從 1 件打樣到約 1,000 件的中小量都很有效率。<\/li>\n<li><strong>缺點<\/strong>：複雜形狀可能很貴或做不出來；開機成本通常比 3D 列印高；一般交期約 10 天，3D 列印約 2–5 天；需要專業人員。<\/li>\n<li><strong>材料相對價格<\/strong>：6061 鋁最便宜（$）；C360 黃銅、ABS、尼龍、POM 中等（<\/li>\n<\/ul>\n<div class=\"mathblock\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>）<\/mi><mi>；<\/mi><mn>304<\/mn><mi>不<\/mi><mi>鏽<\/mi><mi>鋼<\/mi><mi>較<\/mi><mi>貴<\/mi><mi>（<\/mi><\/mrow><\/math><\/div>\n<p>$）。不鏽鋼比鋁硬很多，加工時間和刀具磨耗都比較高。<\/p>\n<ul>\n<li><strong>表面粗糙度<\/strong>：銑削件約 3.2 µm（新機器約 1.6 µm），車削件約 0.8 µm。<\/li>\n<\/ul>\n<h2>解決什麼問題<\/h2>\n<p>讓完全沒接觸過 CNC 的人，先搞懂它在做什麼、有哪幾種、適合做什麼。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>CNC vs. 3D 列印<\/strong>：CNC 精度高、強度好，但開機成本高、交期長（約 10 天 vs. 2–5 天）。<\/li>\n<li><strong>銑削 vs. 車削<\/strong>：圓的、旋轉對稱的零件用車削；其他形狀用銑削。<\/li>\n<li><strong>3 軸 vs. 5 軸<\/strong>：5 軸少翻面、能做複雜形狀，但比較貴。<\/li>\n<\/ul>\n<h2>規格怎麼讀<\/h2>\n<ul>\n<li>「Ra 3.2 µm」：表面粗糙度，數字越小越光滑（原文寫的是 µm，沒有寫 Ra，Ra 是常見寫法，Wiki 補的）。<\/li>\n<li>「ISO 2768」：圖面沒寫公差時用的一般公差標準。<\/li>\n<\/ul>\n<h2>出問題怎麼認<\/h2>\n<ul>\n<li>薄牆容易振動、斷裂。<\/li>\n<li>內角一定是圓的，大小跟刀一樣。<\/li>\n<\/ul>\n<h2>原文與推論<\/h2>\n<p><strong>原文<\/strong><\/p>\n<ul>\n<li>減法製造、G-code、銑削與車削的定義、3 軸與 5 軸、尺寸上限、ISO 2768 約 ±0.125 mm、牆厚、優缺點、交期 10 天與 2–5 天、約 1,000 件、材料相對價格、粗糙度 3.2／1.6／0.8 µm。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li><strong>這篇自己有三處數字不一致<\/strong>：銑床最大尺寸 2,000 × 800 × 1,000 mm（內文）與 2,000 × 800 × 100 mm（表格）；最嚴公差 ±0.025 mm（一處）與 ±0.02 mm（表格），一般公差 ±0.125 mm；金屬牆厚 0.8 mm 與 0.75 mm。Wiki 兩個都記，不採用其中一個當定論。<\/li>\n<li>「ISO 2768 大約 ±0.125 mm」和標準本身不完全對得上：ISO 2768 的公差會隨尺寸大小改變（見 <a class=\"wl\" href=\"#iso2768-1989\">一般公差標準 ISO 2768-1 1989<\/a>）。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>讀了網頁全文的文字。沒有看圖。網頁沒有作者和日期。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>：銑削是刀在轉的那一種<\/li>\n<li><a class=\"wl\" href=\"#cnc-turning\">CNC 車削<\/a>：車削是工件在轉的那一種<\/li>\n<li><a class=\"wl\" href=\"#surface-finish\">表面處理<\/a>：銑削和車削的表面粗糙度<\/li>\n<\/ul>", "back": ["cnc-cost-guide", "cnc-milling", "cnc-turning", "general-tolerance", "machine-setup", "surface-finish", "thin-wall"], "maybe": []}, "hubs-cost-2026": {"title": "CNC 加工省錢的 14 個設計技巧（Protolabs Network／Hubs）", "type": "source", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>CNC 零件貴，多半貴在機器要切多久；14 招都在讓刀切得少、切得快、少換刀、少翻面。<\/p>\n<h2>資料是什麼<\/h2>\n<p>Protolabs Network（舊名 3D Hubs，網址 hubs.com）知識庫裡的一篇設計指南。Hubs 是 CNC 代工的媒合平台，這篇寫給「要發包 CNC 零件的設計者」看，目的是讓圖面更好做、報價更低。<\/p>\n<p>性質是<strong>廠商文章<\/strong>：寫的是業界的經驗法則，不是標準，數字是建議值。這是使用者指定收錄的第一份資料。<\/p>\n<h2>重點<\/h2>\n<p>文章開頭先列出 CNC 報價的四個成本來源：<\/p>\n<ol>\n<li><strong>加工時間<\/strong>：切得越久越貴，通常是最大的一項，量大時更明顯。<\/li>\n<li><strong>開機成本<\/strong>：準備 CAD 檔、規劃加工流程。這筆錢是固定的，所以少量訂單特別吃虧。<\/li>\n<li><strong>其他製造成本<\/strong>：公差很嚴、牆很薄這類難做的形狀，需要特殊刀具、多做品檢、放慢速度。<\/li>\n<li><strong>材料<\/strong>：材料本身的價格，加上好不好切、浪費多少。<\/li>\n<\/ol>\n<p>14 招（照原文編號）：<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>技巧<\/th>\n<th>原文給的規則與例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>內側垂直的角加圓角<\/td>\n<td>圓角半徑至少是凹槽深度的 1/3；所有內角用同一個半徑；槽底用 0.5 或 1 mm 圓角，或不加。例：12 mm 深的槽用 5 mm 以上圓角，就能用 8 mm 的刀切得更快。真的要尖角，改加清角（undercut）而不是把圓角縮小<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>凹槽別太深<\/td>\n<td>深度最多是凹槽最大 XY 尺寸的 4 倍；刀具最好的工作深度約是直徑的 2–3 倍。例：12 mm 端銑刀可切約 25 mm 深。更深要特殊刀具或多軸機<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>薄牆加厚<\/td>\n<td>金屬牆厚 0.8 mm 以上、塑膠 1.5 mm 以上；勉強能做約 0.5 mm（金屬）、1.0 mm（塑膠），要個案評估<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>螺紋別太長<\/td>\n<td>螺紋長度不超過孔徑的 3 倍；超過孔徑 1.5 倍之後，強度幾乎不再增加；盲孔底部要留至少半個孔徑不攻牙<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>用標準孔徑<\/td>\n<td>10 mm 以下以 0.1 mm 為一級、10 mm 以上以 0.5 mm 為一級；孔深最好不超過直徑 4 倍，約 10 倍做得到但比較貴；通孔比盲孔好做<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>必要時才標公差<\/td>\n<td>圖面沒標公差時，會照 ±0.125 mm 或更好的標準公差做；所有標公差的尺寸用同一個基準<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>減少裝夾次數<\/td>\n<td>目標是一次裝夾、簡單的 2.5D 形狀。例：兩面都有盲孔就要裝夾兩次。做不到就拆成幾個零件，之後用螺絲鎖或焊接組合<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>避免細高的小特徵<\/td>\n<td>原文寫寬高比保持在 4:1 以內；可以加補強或連到旁邊的牆上<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>拿掉文字<\/td>\n<td>一定要的話用刻字（凹進去）而不是凸字，用無襯線字型、至少 20 號；網印或噴漆更便宜<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>考慮材料好不好切<\/td>\n<td>C360 黃銅最好切；6061、7075 鋁很容易；不鏽鋼常要鋁的 2 倍以上時間；304 不鏽鋼可切削指數約 45%，303 約 78%。塑膠裡 POM 最好切、ABS 其次，PEEK、尼龍 6 較難<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>考慮材料價格<\/td>\n<td>見下表<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>避免多種表面處理<\/td>\n<td>盡量用「切完原樣」（as machined）；多種處理要多做遮蔽等步驟<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>考慮毛胚尺寸<\/td>\n<td>毛胚每邊至少比成品大 3 mm；成品設計成比標準毛胚小 3 mm 以上。例：30×30×30 mm 的零件要用 35 mm 的板，改成 27 mm 就能用 30 mm 的板<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>利用量產<\/td>\n<td>從 1 件加到 5 件，單價約減半；1,000 件以上，單價可降 5–10 倍<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>第 11 招的材料價格（150×150×25 mm 的板材，原文引用 McMaster 售價，單位美元）：<\/p>\n<table>\n<thead>\n<tr>\n<th>材料<\/th>\n<th>價格<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>6061 鋁<\/td>\n<td>25<\/td>\n<\/tr>\n<tr>\n<td>7075 鋁<\/td>\n<td>80<\/td>\n<\/tr>\n<tr>\n<td>304 不鏽鋼<\/td>\n<td>90<\/td>\n<\/tr>\n<tr>\n<td>303 不鏽鋼<\/td>\n<td>150<\/td>\n<\/tr>\n<tr>\n<td>C360 黃銅<\/td>\n<td>148<\/td>\n<\/tr>\n<tr>\n<td>ABS<\/td>\n<td>17<\/td>\n<\/tr>\n<tr>\n<td>尼龍 6<\/td>\n<td>30<\/td>\n<\/tr>\n<tr>\n<td>POM（Delrin）<\/td>\n<td>27<\/td>\n<\/tr>\n<tr>\n<td>PEEK<\/td>\n<td>300<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>解決什麼問題<\/h2>\n<p>解決「功能一樣的零件，報價卻很貴」：讓設計者在畫圖時就避開會讓加工變慢、變複雜的形狀與規格。<\/p>\n<h2>為什麼選它<\/h2>\n<p>每一招都是用一個比較好做的設計，取代一個機器很難做的設計：尖的內角換成圓角、深槽換成淺槽或拆件、不必要的公差拿掉、難切的材料換成好切的。<\/p>\n<p>代價是設計要遷就加工。功能上真的需要尖角、深槽、嚴公差的地方，就要接受比較貴。<\/p>\n<h2>規格怎麼讀<\/h2>\n<ul>\n<li>「圓角至少是深度的 1/3」：深 12 mm 的槽，圓角半徑至少 4 mm（Wiki 的算術），原文的例子用 5 mm。<\/li>\n<li>「±0.125 mm」：做出來的尺寸可以比圖面大或小 0.125 mm 以內。<\/li>\n<li>「2.5D」：形狀是平面輪廓往下切出不同深度疊起來的，不是自由曲面。<\/li>\n<li>「可切削指數」：拿某個基準材料當 100% 來比，數字越高越好切。原文沒寫基準是哪個材料。<\/li>\n<\/ul>\n<h2>出問題怎麼認<\/h2>\n<p>這份資料沒有談零件做壞的樣子，只提到：薄牆切的時候會變形或斷裂；細高的特徵會振動，做不準。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文<\/strong><\/p>\n<ul>\n<li>四個成本來源、14 招的規則與例子、材料價格表、量產降價的幅度。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>「至少 4 mm」是 Wiki 用 12 mm 乘 1/3 算的。<\/li>\n<li>14 招大多可以歸成四個方向：少切、快切、少換刀、少翻面。這是 Wiki 的整理，原文沒有這樣分。<\/li>\n<li>第 8 招原文寫 width-to-height below 4:1，字面上看起來寫反了（應該是高度不超過寬度的 4 倍）。Wiki 照字面記，等第二份來源確認。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>讀了網頁全文的文字。圖片只讀到圖說，看不到圖的內容；第 14 招的單價圖表沒有數值。網頁沒有作者和發布日期，頁尾寫 2026 年版權，所以檔名用讀取的年份。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>：這 14 招幾乎都是針對銑削<\/li>\n<li><a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>：CNC 省錢篇的閱讀順序與總表<\/li>\n<\/ul>", "back": ["batch-size", "cavity-depth", "cnc-cost-guide", "cnc-milling", "end-mill", "hole-thread", "hubs-cnc-basics-2026", "hubs-design-2026", "internal-corner-radius", "machinability", "machine-setup", "protolabs-cost-2026", "rapiddirect-threads-2022", "surface-finish", "thin-wall", "tolerance", "xometry-cost-2020"], "maybe": []}, "hubs-design-2026": {"title": "CNC 零件設計指南（Protolabs Network／Hubs）", "type": "source", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>把刀的三個限制（形狀、伸不到、會晃）翻成設計規則：建議值和勉強可做的值各一欄。<\/p>\n<h2>資料是什麼<\/h2>\n<p>Protolabs Network（Hubs）知識庫的〈How to design parts for CNC machining〉，原文說是彙整業界專家和代工廠的意見。和 <a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 是同一家公司，那篇講「怎麼省錢」，這篇講「什麼做得出來」。性質是<strong>廠商文章<\/strong>。網頁沒有作者和日期，頁尾寫 2026 年版權。<\/p>\n<h2>重點<\/h2>\n<p><strong>三個限制<\/strong><\/p>\n<ol>\n<li><strong>刀的形狀<\/strong>：刀是圓柱形、能切的長度有限，所以內角一定有圓角。<\/li>\n<li><strong>刀伸不伸得到<\/strong>：刀從上面下來，伸不到的地方就做不出來（倒勾除外）。建議把特徵對齊零件的六個主要方向。<\/li>\n<li><strong>刀會晃<\/strong>：特徵越深，刀要伸越長，越會顫振、越不準。<\/li>\n<\/ol>\n<p><strong>設計規則表<\/strong>（原文表格）<\/p>\n<table>\n<thead>\n<tr>\n<th>特徵<\/th>\n<th>建議<\/th>\n<th>勉強可做<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>凹槽深度<\/td>\n<td>凹槽寬度的 4 倍<\/td>\n<td>深銑可超過刀徑 6 倍；特殊刀具可到 30:1（1 英吋刀最深 35 cm）<\/td>\n<\/tr>\n<tr>\n<td>內角圓角<\/td>\n<td>凹槽深度的 1/3 以上<\/td>\n<td>沒寫<\/td>\n<\/tr>\n<tr>\n<td>槽底圓角<\/td>\n<td>0.5 mm、1 mm 或不加<\/td>\n<td>任何半徑（用球刀）<\/td>\n<\/tr>\n<tr>\n<td>最小牆厚<\/td>\n<td>金屬 0.8 mm、塑膠 1.5 mm<\/td>\n<td>金屬 0.5 mm、塑膠 1.0 mm<\/td>\n<\/tr>\n<tr>\n<td>孔徑<\/td>\n<td>標準鑽頭尺寸<\/td>\n<td>1 mm 以上任何直徑<\/td>\n<\/tr>\n<tr>\n<td>孔深<\/td>\n<td>直徑的 4 倍<\/td>\n<td>直徑的 40 倍（一般 10 倍）<\/td>\n<\/tr>\n<tr>\n<td>螺紋大小<\/td>\n<td>M6 以上<\/td>\n<td>有時可到 M1（絲攻可到 M2；CNC 螺紋刀到 M6）<\/td>\n<\/tr>\n<tr>\n<td>螺紋長度<\/td>\n<td>直徑的 3 倍<\/td>\n<td>最少直徑的 1.5 倍<\/td>\n<\/tr>\n<tr>\n<td>最小孔或凹槽直徑<\/td>\n<td>2.5 mm<\/td>\n<td>0.05 mm（2.5 mm 以下算微細加工）<\/td>\n<\/tr>\n<tr>\n<td>公差<\/td>\n<td>一般 ±0.1 mm<\/td>\n<td>±0.02 mm<\/td>\n<\/tr>\n<tr>\n<td>文字<\/td>\n<td>字型 20 號以上、刻 5 mm<\/td>\n<td>沒寫<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>其他說明<\/strong><\/p>\n<ul>\n<li>沒有另外標的話，公差照 ISO 2768 的中級（m）或精級（f）。<\/li>\n<li>用鑽頭鑽的盲孔，孔底是 135° 的錐形；用端銑刀做的孔底是平的。<\/li>\n<li>M6 以下的盲孔螺紋，孔底要留 1.5 倍直徑不攻牙。<\/li>\n<li><strong>裝夾<\/strong>：要做到每個面就得轉動工件，每轉一次都要重新校正、重新定座標。原文說轉 3 到 4 次通常還可以接受；位置關係要求很準的特徵，要在同一次裝夾裡做完。<\/li>\n<li><strong>5 軸<\/strong>：多了兩個旋轉軸，可以減少或省掉翻面，刀能貼著曲面切、表面更好、時間更短，但比較貴；刀伸不到的內部形狀還是做不出來。<\/li>\n<\/ul>\n<h2>解決什麼問題<\/h2>\n<p>讓設計者在畫圖時就知道「哪些形狀做得出來、哪些要付很多錢才做得出來」。<\/p>\n<h2>為什麼選它<\/h2>\n<p>表格把每條規則分成「建議」和「勉強可做」兩欄：照建議畫，報價最低；超出建議但在可做範圍內，做得出來但比較貴；超出可做範圍，一般 CNC 做不出來。<\/p>\n<h2>規格怎麼讀<\/h2>\n<ul>\n<li>「4 倍凹槽寬度」：寬 10 mm 的槽，建議不超過 40 mm 深（Wiki 的算術）。<\/li>\n<li>「M6 以上」：螺絲直徑 6 mm 以上的公制螺紋。<\/li>\n<li>「±0.1 mm」「±0.02 mm」：見 <a class=\"wl\" href=\"#tolerance\">公差<\/a>。<\/li>\n<li>「ISO 2768-m」：圖面標題欄常見的一般公差寫法，m 是中級。<\/li>\n<\/ul>\n<h2>出問題怎麼認<\/h2>\n<ul>\n<li>深槽、深特徵：刀伸太長會顫振，尺寸不準。<\/li>\n<li>位置要求很準的兩個特徵，如果分兩次裝夾做，兩者之間的位置會有誤差。<\/li>\n<\/ul>\n<h2>原文與推論<\/h2>\n<p><strong>原文<\/strong><\/p>\n<ul>\n<li>三個限制、整張規則表、ISO 2768 m／f 為預設、盲孔 135° 錐底、M6 以下盲孔留 1.5 倍、裝夾 3–4 次可接受、5 軸的優缺點。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>凹槽深度在這篇寫「凹槽寬度的 4 倍」，在 <a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 寫「最大 XY 尺寸的 4 倍」，同一家公司兩篇的寫法也不一樣：寬度通常比最大尺寸小，所以「寬度 4 倍」比較保守。<\/li>\n<li>盲孔留不攻牙的長度：這篇寫 1.5 倍直徑（M6 以下），<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 寫至少半個直徑，兩個都記。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>讀了網頁全文的文字（含規則表）。圖片沒有看。網頁沒有作者和日期。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>：同一家公司的省錢版本<\/li>\n<li><a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a>：深度規則的整理<\/li>\n<li><a class=\"wl\" href=\"#machine-setup\">裝夾次數與拆件<\/a>：裝夾與 5 軸<\/li>\n<li><a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>：所有規則的對照總表<\/li>\n<\/ul>", "back": ["cavity-depth", "cnc-cost-guide", "cnc-milling", "general-tolerance", "hole-thread", "hubs-cnc-basics-2026", "internal-corner-radius", "iso2768-1989", "machine-setup", "rapiddirect-threads-2022", "tap", "thin-wall", "tolerance"], "maybe": []}, "iso2768-1989": {"title": "一般公差標準 ISO 2768-1（1989）", "type": "source", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>圖面沒寫公差的尺寸，照這張表：分精、中、粗、最粗四級，尺寸越大允許差越多。<\/p>\n<h2>資料是什麼<\/h2>\n<p><strong>國際標準<\/strong> ISO 2768-1:1989〈一般公差：第 1 部分：未個別標示公差的長度與角度尺寸〉。Wiki 讀的是印度標準 IS 2102 (Part 1):1993，內容與 ISO 2768-1:1989 完全相同，公開放在 law.resource.org。ISO 2768 是工廠圖面最常見的「未注公差」寫法。<\/p>\n<h2>重點<\/h2>\n<p><strong>適用範圍<\/strong>：沒有個別標公差的長度與角度尺寸，包括外部尺寸、內部尺寸、階差、直徑、半徑、距離、倒角高度。適用於切削加工的零件和板金成形的零件，也可以用在非金屬材料。<\/p>\n<p><strong>為什麼要有一般公差<\/strong>：圖面比較好讀；設計者不用每個尺寸都去算公差；供應商在下單前就知道要做到多準。公差等級應該配合工廠「平常就做得到」的精度。<\/p>\n<p><strong>表 1：長度尺寸的允許偏差（mm）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>等級<\/th>\n<th>0.5–3<\/th>\n<th>&gt;3–6<\/th>\n<th>&gt;6–30<\/th>\n<th>&gt;30–120<\/th>\n<th>&gt;120–400<\/th>\n<th>&gt;400–1000<\/th>\n<th>&gt;1000–2000<\/th>\n<th>&gt;2000–4000<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>f（精）<\/td>\n<td>±0.05<\/td>\n<td>±0.05<\/td>\n<td>±0.1<\/td>\n<td>±0.15<\/td>\n<td>±0.2<\/td>\n<td>±0.3<\/td>\n<td>±0.5<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>m（中）<\/td>\n<td>±0.1<\/td>\n<td>±0.1<\/td>\n<td>±0.2<\/td>\n<td>±0.3<\/td>\n<td>±0.5<\/td>\n<td>±0.8<\/td>\n<td>±1.2<\/td>\n<td>±2<\/td>\n<\/tr>\n<tr>\n<td>c（粗）<\/td>\n<td>±0.2<\/td>\n<td>±0.3<\/td>\n<td>±0.5<\/td>\n<td>±0.8<\/td>\n<td>±1.2<\/td>\n<td>±2<\/td>\n<td>±3<\/td>\n<td>±4<\/td>\n<\/tr>\n<tr>\n<td>v（最粗）<\/td>\n<td>–<\/td>\n<td>±0.5<\/td>\n<td>±1<\/td>\n<td>±1.5<\/td>\n<td>±2.5<\/td>\n<td>±4<\/td>\n<td>±6<\/td>\n<td>±8<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>0.5 mm 以下的尺寸，要在尺寸旁邊另外標公差。<\/p>\n<p><strong>表 2：倒角高度與外側圓角半徑的允許偏差（mm）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>等級<\/th>\n<th>0.5–3<\/th>\n<th>&gt;3–6<\/th>\n<th>&gt;6<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>f、m<\/td>\n<td>±0.2<\/td>\n<td>±0.5<\/td>\n<td>±1<\/td>\n<\/tr>\n<tr>\n<td>c、v<\/td>\n<td>±0.4<\/td>\n<td>±1<\/td>\n<td>±2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>圖面怎麼標<\/strong>：在標題欄裡或旁邊寫「ISO 2768」加等級，例如 ISO 2768-m。<\/p>\n<p><strong>超出一般公差怎麼辦<\/strong>：除非另有約定，超出一般公差的零件，只要不影響功能，不應該自動判不合格；影響功能時才判退。<\/p>\n<h2>解決什麼問題<\/h2>\n<p>一張圖面有幾十個尺寸，如果每個都要寫公差，圖面會又亂又難讀。一般公差讓「不重要的尺寸」共用一套規則，只有重要的尺寸才另外標。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>一般公差 vs. 每個尺寸都標<\/strong>：圖面乾淨、設計省時間，供應商一看就知道精度要求。<\/li>\n<li><strong>f vs. m vs. c<\/strong>：等級越精，允許的偏差越小；例如 30–120 mm 的尺寸，f 級 ±0.15、m 級 ±0.3、c 級 ±0.8 mm。選工廠平常就做得到的等級。<\/li>\n<\/ul>\n<h2>規格怎麼讀<\/h2>\n<ul>\n<li>標題欄寫「ISO 2768-m」：沒標公差的長度尺寸，照表 1 的 m 那一列。例如一個 50 mm 的尺寸，落在 30–120 mm 這一格，允許 ±0.3 mm，也就是 49.7 到 50.3 mm（Wiki 的算術）。<\/li>\n<li>常見的「ISO 2768-mK」：m 是這一部分（長度與角度），K 是第 2 部分（幾何公差）的等級；第 2 部分 Wiki 還沒收錄。<\/li>\n<\/ul>\n<h2>出問題怎麼認<\/h2>\n<p>量到某個沒標公差的尺寸超出表上的範圍：先看它影不影響組裝或功能。照標準，不影響功能的話不應該直接判退。<\/p>\n<h2>原文與推論<\/h2>\n<p><strong>原文<\/strong><\/p>\n<ul>\n<li>適用範圍、目的、表 1、表 2、圖面標示方法、超出時的處理原則。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>50 mm 的例子是 Wiki 用表 1 算的。<\/li>\n<li>標準後來有新版：MISUMI 的技術文章提到 2022 年底發布了 ISO 22081，將取代 ISO 2768（二手說法，Wiki 還沒讀到原文，記進 <a class=\"wl\" href=\"#todo\">待寫清單<\/a>）。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>讀了標準全文（IS 2102 Part 1:1993 的 PDF，與 ISO 2768-1:1989 相同）。PDF 是掃描轉文字，表格有部分字元錯亂，表 1 的數值已和搜尋結果裡同一份 PDF 的原始文字對過一次。表 2 的 v 級欄位文字不清楚，Wiki 照 c 級那一列處理，<strong>這一格還要再核對<\/strong>。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#tolerance\">公差<\/a>：公差是什麼<\/li>\n<li><a class=\"wl\" href=\"#general-tolerance\">一般公差<\/a>：怎麼讀圖面上的 ISO 2768-m<\/li>\n<li><a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>：代工廠預設用 ISO 2768 的 m 或 f<\/li>\n<\/ul>", "back": ["cnc-cost-guide", "general-tolerance", "hubs-cnc-basics-2026", "tolerance"], "maybe": []}, "protolabs-cost-2026": {"title": "如何降低 CNC 加工成本（Protolabs）", "type": "source", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>用清角取代尖角、自己去毛邊、別刻字、牆別太薄、形狀簡單、換好切的材料，六招降成本。<\/p>\n<h2>資料是什麼<\/h2>\n<p>Protolabs 官網的設計建議文章〈How to Reduce CNC Machining Costs〉。Protolabs 是美國的快速打樣與加工廠，自己有 CNC 產線，所以這篇是<strong>加工廠自己寫的經驗法則<\/strong>。<\/p>\n<p>注意：Hubs（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）現在也是 Protolabs 集團的一部分，兩篇不完全是獨立的聲音，但寫法和數字不同，看得出是不同團隊寫的。<\/p>\n<h2>重點<\/h2>\n<ol>\n<li><strong>內角加清角<\/strong>：真正的尖內角通常要靠放電加工（EDM），或用好幾片平板鎖起來，又慢又貴。範例裡最小的切鋼端銑刀直徑 0.8 mm，在 304 不鏽鋼上會留下 0.4 mm 的圓角；這種小刀的長度大約只能到直徑的 5 倍，所以也切不深，而且切得慢。改成在每個角切一個 6.35 mm 寬的清角，功能上等於尖角的槽可以深到約 32 mm。鋁或塑膠可切的槽深是鋼的 2 倍。刀越大切越快，成本越低。<\/li>\n<li><strong>毛邊自己去<\/strong>：在外側邊緣加倒角或圓角來去毛邊，要用球刀多走一道 3D 輪廓，很花錢。Protolabs 對金屬件有自動去毛邊，塑膠件出貨時邊緣是利的；很多客戶自己用銼刀、砂紙處理。<\/li>\n<li><strong>先別刻字<\/strong>：刻字要用很小的球刀描每個字，很花時間。最小字畫寬度：金屬 0.90 mm、塑膠 0.51 mm。文字比較適合量大的射出成型件。<\/li>\n<li><strong>小心薄牆<\/strong>：標準公差是 ±0.13 mm。0.51 mm 以下的特徵會被報價軟體標成薄牆，還是能做，但成品可能和設計有點出入。薄牆切的時候會斷，切完也會彎、會翹。<\/li>\n<li><strong>形狀簡單<\/strong>：很深的槽即使有清角也很耗時；槽和牆越深，原料裡的殘留應力越容易讓零件變形。加肋可以防變形，但又會增加加工成本。昂貴的特徵包括雕塑曲面、很深的散熱鰭片槽、很深的孔（例如油壓歧管）、螺紋。太複雜就拆成幾個零件再用螺絲組合。<\/li>\n<li><strong>換材料<\/strong>：17-4 PH 不鏽鋼很難切，不需要那麼強、那麼耐蝕時可改 316L 或 304；銅很貴，鋁的導電度約是銅的 60%，又輕又便宜；黃銅軟、好銑；塑膠多半好切，但比較軟的塑膠尺寸容易不穩、會牽絲。<\/li>\n<\/ol>\n<h2>解決什麼問題<\/h2>\n<p>和 <a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 一樣：讓設計在不改變功能的前提下，變得比較好做、比較便宜。這篇特別多講了「真的需要尖角時怎麼辦」。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>清角 vs. 縮小圓角<\/strong>：要讓別的零件塞進角落，縮小圓角得換很小的刀，又慢又切不深；清角是用正常大小的刀在角落多挖一個 U 形，角落「功能上是尖的」，刀卻可以很大。代價是角落多一個缺口。<\/li>\n<li><strong>拆件 vs. 一體成形<\/strong>：拆成幾個零件會多組裝成本，但難做的零件趕時間時常常值得。<\/li>\n<\/ul>\n<h2>規格怎麼讀<\/h2>\n<ul>\n<li>「0.25 in（6.35 mm）寬的清角」：清角的寬度，等於用來挖它的刀的直徑（Wiki 推論）。<\/li>\n<li>「±0.005 in（±0.13 mm）」：這間廠沒有特別標的尺寸，照這個公差做。<\/li>\n<li>原文是英制，括號內的公制是原文附的換算。<\/li>\n<\/ul>\n<h2>出問題怎麼認<\/h2>\n<ul>\n<li>薄牆：切完會彎、會翹，嚴重的話切的時候就斷了。<\/li>\n<li>深槽和深牆：原料殘留應力釋放，零件切完會走樣。<\/li>\n<li>軟塑膠：尺寸不穩、切口有牽絲。<\/li>\n<\/ul>\n<h2>原文與推論<\/h2>\n<p><strong>原文<\/strong><\/p>\n<ul>\n<li>尖角要 EDM 或拼板；0.8 mm 刀留 0.4 mm 圓角；小刀長度約 5 倍直徑；6.35 mm 清角可做約 32 mm 深；鋁和塑膠可切深度是鋼的 2 倍。<\/li>\n<li>去毛邊、刻字的最小尺寸（0.90 mm、0.51 mm）、標準公差 ±0.13 mm、0.51 mm 以下算薄牆。<\/li>\n<li>殘留應力、昂貴特徵清單、拆件、材料替代（17-4 PH、316L、304、銅與鋁的導電度約 60%）。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>清角寬度等於刀的直徑。<\/li>\n<li>0.8 mm 刀留 0.4 mm 圓角，代表圓角半徑等於刀的半徑；這和 Hubs 設計指南的說法一致，等收錄後再對照。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>讀了網頁全文的文字。圖片只讀到圖說（左圖是銑削留下的圓角，右圖是加了清角）。網頁沒有作者和發布日期，頁尾寫 2026 年版權。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>：另一份省錢清單，規則可以互相對照<\/li>\n<li><a class=\"wl\" href=\"#internal-corner-radius\">內角圓角與清角<\/a>：清角的詳細說明<\/li>\n<li><a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>：另一家公司的版本，可以當獨立對照<\/li>\n<li><a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>：CNC 省錢篇的總表<\/li>\n<\/ul>", "back": ["cavity-depth", "cnc-cost-guide", "cnc-milling", "end-mill", "internal-corner-radius", "machinability", "machine-setup", "thin-wall", "tolerance", "xometry-cost-2020"], "maybe": []}, "rapiddirect-threads-2022": {"title": "螺紋孔：種類、做法與注意事項（RapidDirect，Chan 2022）", "type": "source", "updated": "2026-11-27", "html": "<h2>一句話<\/h2>\n<p>攻牙分鑽孔、倒角、攻牙幾步；絲攻前端是削尖的，尖端那幾牙切不完整，所以盲孔要鑽深一點。<\/p>\n<h2>資料是什麼<\/h2>\n<p>RapidDirect（中國的 CNC 代工平台）部落格文章〈Threaded holes〉，作者 Violet Chan，2022-11-07 發布、2025-12-16 更新；有簡體中文版〈螺纹孔〉。性質是<strong>廠商文章<\/strong>，寫給要設計或加工螺紋孔的人。使用者 2026-11-27 問「盲孔底部為什麼不攻牙」時找來的來源。<\/p>\n<h2>重點<\/h2>\n<ul>\n<li><strong>盲孔與通孔<\/strong>：盲孔沒有穿透零件；孔底可以是平的（用端銑刀做），也可以是錐形的（用一般鑽頭做）。通孔完全穿透，兩面都有開口。<\/li>\n<li><strong>做螺紋孔的步驟<\/strong>：<\/li>\n<li>用麻花鑽鑽出底孔，鑽頭的直徑和長度都要選對。<\/li>\n<li>在孔口倒角：讓螺絲比較好對正、減少毛邊，也能延長刀具壽命。<\/li>\n<li>底孔大小由螺絲尺寸決定，螺絲直徑比鑽出來的孔大（因為牙要切進孔壁）。鑽孔時不要太深；但用先攻絲攻時，因為它切不出完整的牙，孔要夠深。<\/li>\n<li>攻牙：每順時針轉 360°，就逆時針退 180°，目的是不讓切屑堆積。<\/li>\n<li><strong>三種絲攻<\/strong>（原文的分類，台灣現場常叫先攻、中攻、後攻）：<\/li>\n<li><strong>先攻（taper tap）<\/strong>：從尖端開始有 6 到 7 個逐漸變細的切削齒，適合硬材料和盲孔；但不建議用它把螺紋做完，因為前面 10 牙可能沒有完全成形。<\/li>\n<li><strong>中攻（plug tap）<\/strong>：接在先攻之後，把牙攻得更深、更完整；不建議靠近工件邊緣，也不適合很小的孔。<\/li>\n<li><strong>後攻（bottoming tap）<\/strong>：開頭只有 1 到 2 個切削齒，用在很深的孔。師傅通常照先攻、中攻、後攻的順序用。<\/li>\n<li><strong>公制螺紋的寫法<\/strong>：M6×1.00 是直徑 6 mm、螺距 1.00 mm；M10×1.50、M12×1.75 也是同樣的寫法。<\/li>\n<li><strong>切削絲攻 vs. 擠壓絲攻<\/strong>：切削絲攻把材料切掉；擠壓絲攻把材料擠成牙，不會產生切屑，適合鋁、黃銅這類軟材料。<\/li>\n<li><strong>其他注意事項<\/strong>：硬材料要用超硬絲攻、放慢、加潤滑；盲孔的深度很難控制，通孔比較容易；靠近邊緣或斜面攻牙，絲攻容易滑掉或斷掉，斜面要先銑出一個平面。<\/li>\n<\/ul>\n<h2>解決什麼問題<\/h2>\n<p>解決「螺絲要鎖進一個零件，但不能用螺帽」：在孔壁上直接做出內螺紋。這篇也回答了 Wiki 原本缺的一塊：為什麼盲孔要比螺紋鑽得更深。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>先攻、中攻、後攻<\/strong>：先攻的尖端長、逐漸變細，比較好咬進去、切削力小，但尖端那段的牙不完整；後攻的尖端很短，可以把牙一路做到接近孔底。所以要分幾支輪流用。<\/li>\n<li><strong>擠壓絲攻 vs. 切削絲攻<\/strong>：擠壓絲攻沒有切屑，軟材料適用；切削絲攻適用範圍比較廣。<\/li>\n<li><strong>攻牙 vs. 螺紋銑削<\/strong>：很硬的材料攻牙比較有優勢；螺紋銑削可以用同一把刀做不同直徑和深度的螺紋，可能比較省錢。<\/li>\n<\/ul>\n<h2>規格怎麼讀<\/h2>\n<ul>\n<li>「M6×1.00」：M 是公制螺紋，6 是直徑 6 mm，1.00 是螺距（相鄰兩牙的距離）1.00 mm。<\/li>\n<li>底孔要比螺絲直徑小，確切大小要查攻牙底孔表；這篇沒有給表。<\/li>\n<\/ul>\n<h2>出問題怎麼認<\/h2>\n<ul>\n<li>用先攻把牙做完：靠近孔底那段的牙不完整，螺絲鎖到那裡就鎖不緊（Wiki 推論，原文只說前 10 牙可能沒完全成形）。<\/li>\n<li>切屑堆積：所以要轉一圈退半圈。<\/li>\n<li>絲攻斷掉：在邊緣、斜面攻牙，或刀具已經損壞時容易發生。<\/li>\n<\/ul>\n<h2>原文與推論<\/h2>\n<p><strong>原文<\/strong><\/p>\n<ul>\n<li>盲孔孔底是平的或錐形的；三種絲攻的齒數（6 到 7、1 到 2）與用途；先攻的前 10 牙可能沒完全成形；用先攻時孔要夠深；轉 360° 退 180° 防切屑堆積；擠壓絲攻無切屑；M6×1.00 等寫法；硬材料、斜面、邊緣的注意事項。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>「盲孔底部要留一段不攻牙」的規則來自 <a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 與 <a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>；這篇沒有直接講那條規則，但說明了原因之一：絲攻尖端切不出完整的牙，所以孔要比完整螺紋更深。把兩邊接起來是 Wiki 的推論。<\/li>\n<li>原文說先攻有 6 到 7 個切削齒，又說前 10 牙可能沒成形，兩個數字對不太上，Wiki 兩個都照原文記。<\/li>\n<li>原文說轉一圈退半圈是為了不讓切屑堆積；「盲孔底部要留空間放切屑」原文沒有直接說，仍是推論。<\/li>\n<li>先攻、中攻、後攻是台灣現場的常見叫法，原文是英文的 taper、plug、bottoming。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>讀了英文版網頁全文的文字（簡體中文版是同一篇的翻譯，當時讀不到）。沒有看圖。原文沒有給螺紋深度的倍數規則，也沒有給倒角大小。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#tap\">絲攻<\/a>：三種絲攻長什麼樣子<\/li>\n<li><a class=\"wl\" href=\"#hole-thread\">孔與螺紋<\/a>：盲孔底部為什麼要留一段不攻牙<\/li>\n<li><a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>：另一份談絲攻容易斷的來源<\/li>\n<\/ul>", "back": ["hole-thread", "tap"], "maybe": []}, "xometry-cost-2020": {"title": "降低 CNC 加工成本的十個方法（Xometry，Lichtig 2020）", "type": "source", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>加工時間常是最大的成本；十招都在縮短切削時間、減少換刀與裝夾、分攤開機成本。<\/p>\n<h2>資料是什麼<\/h2>\n<p>Xometry 是美國的製造媒合平台，這篇是官網資源區的文章，作者 Aaron Lichtig，2020-09-22 發布、2023-02-21 更新。性質是<strong>廠商文章<\/strong>，和 Protolabs 集團（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）是不同公司，可以當獨立的對照。原文用英制單位。<\/p>\n<h2>重點<\/h2>\n<p>文章的前提：加工時間常常是最大的成本，可能比材料、開機、表面處理加起來還多。<\/p>\n<ol>\n<li><strong>內角做圓角<\/strong>：原文寫內角圓角的「長度比直徑（L:D）」保持在 3:1 以內；圓角大，刀走的趟數少；所有內角半徑一致，避免換刀。<\/li>\n<li><strong>避免深槽<\/strong>：原文寫槽的長度最多是深度的 4 倍；更深就要用容易斷的細長刀，只能分層往下切，或改用拉削、線切割這類更貴的方法。超過這個比例，成本急速上升。<\/li>\n<li><strong>少標嚴公差<\/strong>：只有關鍵特徵才標數字公差，其他用標準公差 ±0.005 英吋；定一個基準，所有尺寸從它量起。Xometry 一般能做的公差範圍是 0.005 到 0.001 英吋。<\/li>\n<li><strong>薄牆加厚<\/strong>：最小牆厚 1/32 英吋（0.794 mm）；太薄會顫振、變形，切得慢又難守公差。牆真的很薄時，改用<strong>板金<\/strong>通常比較划算。<\/li>\n<li><strong>攻牙孔<\/strong>：螺紋深度不超過孔徑的 3 倍，因為只有前 2–3 牙在出力；攻太深，絲攻容易斷。用標準絲攻尺寸；比 2-56 更小的孔要手工攻牙。<\/li>\n<li><strong>用標準鑽頭尺寸<\/strong>：用標準的分數、號數、字母或整數公釐尺寸；非標準尺寸要改用端銑刀或鉸刀，多花機器時間。避免 0.492 英吋、3.841 mm 這種尺寸。<\/li>\n<li><strong>用便宜的材料<\/strong>：6061 鋁這種較軟的金屬，原料便宜、切得快、刀磨得少；硬材料要更貴的刀、刀也更常斷。6061 太軟的話，可以考慮好切的低碳鋼。<\/li>\n<li><strong>避免多種表面處理<\/strong>：例如同一個零件又要陽極處理又要化成皮膜、又要拋光又要噴砂，都會多出製程；統一一種，或不做處理。<\/li>\n<li><strong>拆開複雜零件<\/strong>：簡單的零件分開加工，再用焊接或螺絲組合。深槽和多面加工特別適用，因為多面加工會增加夾治具和裝夾的時間。<\/li>\n<li><strong>一次訂多一點<\/strong>：程式和裝夾的成本由更多件分攤，單價就降低。原文說 CNC 在 10,000 件以內的量最划算。<\/li>\n<\/ol>\n<h2>解決什麼問題<\/h2>\n<p>和 Protolabs 集團的兩篇一樣，解決「設計讓加工時間變長、報價變高」。這篇多談了攻牙、標準鑽頭這種孔的細節，以及什麼時候該改用板金。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>標準尺寸 vs. 特殊尺寸<\/strong>：標準鑽頭一次鑽好；特殊尺寸要換端銑刀或鉸刀慢慢修。<\/li>\n<li><strong>CNC vs. 板金<\/strong>：牆很薄的零件，用板金折出來通常比用一塊料慢慢挖便宜。<\/li>\n<li><strong>一體 vs. 拆件<\/strong>：拆件多了組裝，但省下深槽和多面加工的時間。<\/li>\n<\/ul>\n<h2>規格怎麼讀<\/h2>\n<ul>\n<li>「±0.005 英吋」約等於 ±0.127 mm（Wiki 的算術：0.005 × 25.4）。<\/li>\n<li>「4-40」「2-56」是美制小螺絲的寫法：前面是號數（越大越粗），後面是每英吋幾牙。公制的寫法是 M3、M6 這種。<\/li>\n<li>「L:D」：長度比直徑。原文把它用在內角圓角上，但沒有說 L 和 D 各指什麼（Wiki 推測 L 是槽深、D 是刀徑）。<\/li>\n<\/ul>\n<h2>出問題怎麼認<\/h2>\n<ul>\n<li>薄牆：切的時候顫振，牆面有振紋、變形。<\/li>\n<li>攻牙太深：絲攻斷在孔裡。<\/li>\n<li>細長刀：容易斷。<\/li>\n<\/ul>\n<h2>原文與推論<\/h2>\n<p><strong>原文<\/strong><\/p>\n<ul>\n<li>加工時間常是最大成本；L:D 3:1；槽長最多 4 倍深度；標準公差 ±0.005 英吋、範圍 0.005 到 0.001 英吋；最小牆厚 1/32 英吋（0.794 mm）；螺紋 3 倍孔徑、前 2–3 牙出力；2-56 以下手工攻牙；避免 0.492 英吋、3.841 mm；10,000 件以內最划算。<\/li>\n<\/ul>\n<p><strong>推論（Wiki 補的）<\/strong><\/p>\n<ul>\n<li>第 1 招的 L 與 D 各指什麼，原文沒說。<\/li>\n<li>第 2 招「槽的長度最多是深度的 4 倍」，字面上是限制長度，和 <a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 的「深度最多是 XY 尺寸的 4 倍」方向相反。Wiki 判斷兩篇想講的是同一件事（槽不要太深），但原文字面不同，兩個都照實記。<\/li>\n<li>±0.005 英吋換成公制約 ±0.127 mm，和 Hubs 的 ±0.125 mm、Protolabs 的 ±0.13 mm 幾乎一樣。<\/li>\n<\/ul>\n<h2>讀了什麼<\/h2>\n<p>讀了網頁全文的文字。沒有看圖。<\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>：另一份省錢清單，大部分規則一致<\/li>\n<li><a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>：加工廠的版本<\/li>\n<li><a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>：三份來源對照的總表<\/li>\n<\/ul>", "back": ["batch-size", "cavity-depth", "cnc-cost-guide", "cnc-milling", "hole-thread", "internal-corner-radius", "machinability", "machine-setup", "protolabs-cost-2026", "rapiddirect-threads-2022", "surface-finish", "tap", "thin-wall", "tolerance"], "maybe": []}, "todo": {"title": "待寫清單", "type": "overview", "updated": "2026-11-25", "html": "<p>新點子只記在這裡，不展開。概念出現在 2 份以上來源，才拆成獨立頁（AGENTS.md 第 7 節）。<\/p>\n<h2>等第二份來源的概念<\/h2>\n<table>\n<thead>\n<tr>\n<th>概念<\/th>\n<th>出現在哪些來源<\/th>\n<th>次數<\/th>\n<th>狀態<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>內角圓角、清角<\/td>\n<td>hubs-cost-2026、protolabs-cost-2026、xometry-cost-2020<\/td>\n<td>3<\/td>\n<td>已拆 <a class=\"wl\" href=\"#internal-corner-radius\">內角圓角與清角<\/a>；已有 Protolabs 集團以外的來源<\/td>\n<\/tr>\n<tr>\n<td>凹槽深度<\/td>\n<td>hubs-cost-2026、protolabs-cost-2026<\/td>\n<td>2<\/td>\n<td>已拆 <a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a><\/td>\n<\/tr>\n<tr>\n<td>薄牆<\/td>\n<td>hubs-cost-2026、protolabs-cost-2026<\/td>\n<td>2<\/td>\n<td>已拆 <a class=\"wl\" href=\"#thin-wall\">薄牆與細高特徵<\/a>（含細高特徵）<\/td>\n<\/tr>\n<tr>\n<td>螺紋長度、標準孔徑<\/td>\n<td>hubs-cost-2026、xometry-cost-2020<\/td>\n<td>2<\/td>\n<td>已拆 <a class=\"wl\" href=\"#hole-thread\">孔與螺紋<\/a><\/td>\n<\/tr>\n<tr>\n<td>公差<\/td>\n<td>hubs-cost-2026、protolabs-cost-2026、xometry-cost-2020<\/td>\n<td>3<\/td>\n<td>已拆 <a class=\"wl\" href=\"#tolerance\">公差<\/a><\/td>\n<\/tr>\n<tr>\n<td>裝夾次數、拆件<\/td>\n<td>hubs-cost-2026、protolabs-cost-2026、xometry-cost-2020<\/td>\n<td>3<\/td>\n<td>已拆 <a class=\"wl\" href=\"#machine-setup\">裝夾次數與拆件<\/a><\/td>\n<\/tr>\n<tr>\n<td>文字與刻字<\/td>\n<td>hubs-cost-2026、protolabs-cost-2026、hubs-design-2026<\/td>\n<td>3<\/td>\n<td>可拆；對省錢篇是小項目，先寫在導覽總表<\/td>\n<\/tr>\n<tr>\n<td>材料可切削性、材料價格<\/td>\n<td>hubs-cost-2026、protolabs-cost-2026<\/td>\n<td>2<\/td>\n<td>已拆 <a class=\"wl\" href=\"#machinability\">材料好不好切<\/a><\/td>\n<\/tr>\n<tr>\n<td>表面處理<\/td>\n<td>hubs-cost-2026、xometry-cost-2020<\/td>\n<td>2<\/td>\n<td>已拆 <a class=\"wl\" href=\"#surface-finish\">表面處理<\/a><\/td>\n<\/tr>\n<tr>\n<td>毛胚尺寸<\/td>\n<td>hubs-cost-2026<\/td>\n<td>1<\/td>\n<td>等第二份<\/td>\n<\/tr>\n<tr>\n<td>去毛邊、外側倒角<\/td>\n<td>protolabs-cost-2026<\/td>\n<td>1<\/td>\n<td>等第二份<\/td>\n<\/tr>\n<tr>\n<td>殘留應力<\/td>\n<td>protolabs-cost-2026<\/td>\n<td>1<\/td>\n<td>等第二份<\/td>\n<\/tr>\n<tr>\n<td>放電加工（EDM）、線切割<\/td>\n<td>protolabs-cost-2026、xometry-cost-2020<\/td>\n<td>2<\/td>\n<td>可拆；
