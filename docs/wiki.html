<style>
/* VOICE: 現場的工作筆記本：冷靜、清楚，像一本整理好的加工手冊
   IDEA: 一本帳簿：每一頁都在回答「錢從誰流到誰」
   PICTURE: 首頁的總覽表本身就是主角；頂部一條黃色標記寫出核心問題
   COLOUR and TYPE: 白底、墨色 #101418、只在核心問題與類型標籤用黃 #ffd84a；Manrope + Noto Sans TC

:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#101418);--ink:light-dark(#101418,#e8ecf0);--muted:light-dark(#5b6670,#9aa6b1);
  --line:light-dark(#e3e7eb,#26303a);--side:light-dark(#f5f7f9,#151b21);--hl:#ffd84a;--hl-ink:#101418;
  --link:light-dark(#1f4fd1,#8fb2ff);--chip:light-dark(#eef1f4,#1e2630)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Manrope","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow-x:clip}

.fig{overflow-x:auto}.fig-svg{width:100%;min-width:560px;height:auto;display:block;font-family:inherit}
.f-h{font-size:14px;font-weight:700;fill:var(--ink)}
.f-lab{font-size:13px;fill:var(--ink)}.f-tick{font-size:12px;fill:var(--muted)}
.f-note{font-size:12px;fill:var(--muted)}
.f-a{fill:none;stroke:var(--ink);stroke-width:2}.f-b{fill:none;stroke:var(--link);stroke-width:2}
.f-ka{fill:var(--ink)}.f-kb{fill:var(--link)}
.f-s{fill:none;stroke:var(--ink);stroke-width:1.8}
.f-band{stroke:var(--muted);stroke-dasharray:5 5}.f-zero{stroke:var(--muted)}

.f-in{fill:var(--hl);stroke:var(--hl-ink);stroke-width:1.5}.f-out{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.k-dot{fill:var(--muted);opacity:.55}.k-ma{fill:none;stroke:var(--link);stroke-width:3}
.k-kf{fill:none;stroke:#d6453d;stroke-width:3}.k-turn{stroke:var(--muted);stroke-dasharray:4 4}
.kl text{font-size:16px;fill:var(--ink);text-anchor:middle}
.kl .kl-t{font-size:22px;font-weight:800}.kl .kl-s{font-size:14px;fill:var(--muted);font-weight:600}
.kl-n rect{fill:var(--bg);stroke:var(--ink);stroke-width:2.5}
.kl-c rect{fill:var(--hl);stroke:var(--hl-ink);stroke-width:2.5}.kl-c text{fill:var(--hl-ink)}
.kl-g rect{fill:var(--side);stroke:var(--line);stroke-width:1.5}.kl .kl-gt{font-weight:800}
.kl-e{fill:none;stroke:var(--ink);stroke-width:2.5}.kl-head{fill:var(--ink)}
.nb .nb-c{fill:none;stroke:var(--ink);stroke-width:3}.nb-1{fill:var(--hl);opacity:.55}.nb-2{fill:var(--hl);opacity:.22}
.nb-ax{stroke:var(--muted);stroke-width:1.5}.nb text{font-size:14px;fill:var(--ink)}.nb .nb-big{font-size:22px;font-weight:800}
.nb .nb-n{font-size:12px;fill:var(--muted)}
.nf-a{fill:none;stroke:var(--ink);stroke-width:2.5}.nf-b{fill:none;stroke:var(--link);stroke-width:2.5}
.nf-f{fill:rgba(214,69,61,.12);stroke:#d6453d;stroke-width:3.5}.nf-mid{stroke:#d6453d;stroke-dasharray:4 4}
.nb .nf-ta{font-weight:700}.nb .nf-tb{font-weight:700;fill:var(--link)}.nb .nf-tf{font-weight:800;fill:#d6453d}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:6px 0 10px 14px;display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:4px 14px;max-width:none}
.tl li::before{content:"";position:absolute;left:-25px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.tl li.bad::before{background:#d6453d;border-color:#d6453d}.tl li.good::before{background:var(--hl);border-color:var(--hl-ink)}
.tl b{white-space:nowrap}
.fig-src{font-size:13px;color:var(--muted);margin:10px 0 0}
@media(max-width:600px){.tl li{grid-template-columns:minmax(0,1fr)}}
@media(max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  nav{display:none}
  .mnav{display:block;border-bottom:1px solid var(--line);background:var(--side)}
  .mnav summary{padding:12px max(4vw,16px);font-weight:700;cursor:pointer;min-height:44px}
  .mnav nav{display:block;position:static;max-height:none;border:0}
  .counts{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:no-preference){article{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}

<script>
{
const DATA = {"pages": {"cnc-cost-guide": {"title": "CNC 省錢篇：零件到底貴在哪裡", "type": "overview", "updated": "2026-11-25", "html": "<p>這是 Wiki 的第一個主題。核心問題套在這裡：<strong>每一條設計規則在解決什麼問題？為什麼選它，不選別的？<\/strong><\/p>\n<h2>先抓住一句話<\/h2>\n<p>CNC 的報價，最大的一塊通常是<strong>機器要切多久<\/strong>（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）。所以幾乎每一條省錢規則，都在做這四件事之一：<strong>少切、快切、少換刀、少翻面<\/strong>（Wiki 的整理，原文沒這樣分）。<\/p>\n<h2>建議閱讀順序<\/h2>\n<ol>\n<li><strong>CNC 在做什麼<\/strong>：<a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>（刀轉）和 <a class=\"wl\" href=\"#cnc-turning\">CNC 車削<\/a>（工件轉）<\/li>\n<li><strong>刀的形狀決定了一切<\/strong>：<a class=\"wl\" href=\"#end-mill\">端銑刀<\/a> → <a class=\"wl\" href=\"#internal-corner-radius\">內角圓角與清角<\/a> → <a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a> → <a class=\"wl\" href=\"#thin-wall\">薄牆與細高特徵<\/a><\/li>\n<li><strong>孔與螺紋<\/strong>：<a class=\"wl\" href=\"#hole-thread\">孔與螺紋<\/a> → <a class=\"wl\" href=\"#tap\">絲攻<\/a><\/li>\n<li><strong>圖面上的數字<\/strong>：<a class=\"wl\" href=\"#tolerance\">公差<\/a> → <a class=\"wl\" href=\"#general-tolerance\">一般公差<\/a><\/li>\n<li><strong>翻面與拆件<\/strong>：<a class=\"wl\" href=\"#machine-setup\">裝夾次數與拆件<\/a><\/li>\n<li><strong>材料、表面、數量<\/strong>：<a class=\"wl\" href=\"#machinability\">材料好不好切<\/a> → <a class=\"wl\" href=\"#surface-finish\">表面處理<\/a> → <a class=\"wl\" href=\"#batch-size\">數量與開機成本<\/a><\/li>\n<\/ol>\n<h2>總表：每條規則在解決什麼、為什麼選它<\/h2>\n<table>\n<thead>\n<tr>\n<th>規則<\/th>\n<th>解決什麼問題<\/th>\n<th>為什麼選它（跟什麼比）<\/th>\n<th>來源的數字<\/th>\n<th>頁<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>內角加圓角<\/td>\n<td>刀是圓的，切不出尖的內角<\/td>\n<td>大圓角能用大刀、切得快；小圓角要換小刀慢慢切<\/td>\n<td>圓角至少是凹槽深度的 1/3（Hubs）<\/td>\n<td><a class=\"wl\" href=\"#internal-corner-radius\">內角圓角與清角<\/a><\/td>\n<\/tr>\n<tr>\n<td>要尖角就加清角<\/td>\n<td>方形零件要塞到角落<\/td>\n<td>清角用正常大小的刀；縮小圓角要用很小的刀，又慢又切不深<\/td>\n<td>6.35 mm 寬的清角可做到約 32 mm 深（Protolabs）<\/td>\n<td><a class=\"wl\" href=\"#internal-corner-radius\">內角圓角與清角<\/a><\/td>\n<\/tr>\n<tr>\n<td>凹槽別太深<\/td>\n<td>刀伸越長越會晃<\/td>\n<td>淺槽穩又快；太深就拆件<\/td>\n<td>深度不超過凹槽寬度的 4 倍（Hubs 設計指南）；刀最舒服的深度約 2–3 倍刀徑<\/td>\n<td><a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a><\/td>\n<\/tr>\n<tr>\n<td>牆別太薄<\/td>\n<td>薄牆一切就晃、會斷會翹<\/td>\n<td>加厚最便宜；加肋也要加工；很薄就改板金<\/td>\n<td>金屬 0.8 mm、塑膠 1.5 mm（Hubs）；0.794 mm（Xometry）<\/td>\n<td><a class=\"wl\" href=\"#thin-wall\">薄牆與細高特徵<\/a><\/td>\n<\/tr>\n<tr>\n<td>用標準孔徑<\/td>\n<td>特殊尺寸要換刀慢慢修<\/td>\n<td>標準鑽頭一次到位<\/td>\n<td>10 mm 以下以 0.1 mm 為一級（Hubs）<\/td>\n<td><a class=\"wl\" href=\"#hole-thread\">孔與螺紋<\/a><\/td>\n<\/tr>\n<tr>\n<td>螺紋別攻太深<\/td>\n<td>攻太深絲攻會斷，強度也沒變強<\/td>\n<td>3 倍孔徑就夠<\/td>\n<td>螺紋長度不超過孔徑的 3 倍（Hubs、Xometry）<\/td>\n<td><a class=\"wl\" href=\"#hole-thread\">孔與螺紋<\/a><\/td>\n<\/tr>\n<tr>\n<td>只標必要的公差<\/td>\n<td>越嚴越要慢慢切、多量<\/td>\n<td>不重要的尺寸交給一般公差<\/td>\n<td>標準公差約 ±0.125 mm（Hubs）、±0.13 mm（Protolabs）<\/td>\n<td><a class=\"wl\" href=\"#tolerance\">公差<\/a><\/td>\n<\/tr>\n<tr>\n<td>讀懂 ISO 2768-m<\/td>\n<td>沒寫公差的尺寸該多準<\/td>\n<td>查表，不用每個都標<\/td>\n<td>30–120 mm 的 m 級是 ±0.3 mm（ISO 2768）<\/td>\n<td><a class=\"wl\" href=\"#general-tolerance\">一般公差<\/a><\/td>\n<\/tr>\n<tr>\n<td>少翻面<\/td>\n<td>每翻一次就要重夾、重對位<\/td>\n<td>一次裝夾最省；做不到就拆件或用 5 軸<\/td>\n<td>轉 3 到 4 次通常還能接受（Hubs 設計指南）<\/td>\n<td><a class=\"wl\" href=\"#machine-setup\">裝夾次數與拆件<\/a><\/td>\n<\/tr>\n<tr>\n<td>選好切的材料<\/td>\n<td>難切的材料切得慢、刀磨得快<\/td>\n<td>6061 鋁又便宜又好切<\/td>\n<td>不鏽鋼常要鋁的 2 倍以上時間（Hubs）<\/td>\n<td><a class=\"wl\" href=\"#machinability\">材料好不好切<\/a><\/td>\n<\/tr>\n<tr>\n<td>只用一種表面處理<\/td>\n<td>多種處理要多做遮蔽<\/td>\n<td>切削原樣最便宜<\/td>\n<td>兩份來源都沒給數字<\/td>\n<td><a class=\"wl\" href=\"#surface-finish\">表面處理<\/a><\/td>\n<\/tr>\n<tr>\n<td>一次多訂幾件<\/td>\n<td>開機成本是固定的<\/td>\n<td>件數多，每件分到的少<\/td>\n<td>1 件加到 5 件，單價約減半（Hubs）<\/td>\n<td><a class=\"wl\" href=\"#batch-size\">數量與開機成本<\/a><\/td>\n<\/tr>\n<tr>\n<td>文字少用<\/td>\n<td>刻字要用小刀慢慢描<\/td>\n<td>改用網印、噴漆；一定要就用刻字、字大一點<\/td>\n<td>字型 20 號以上（Hubs）<\/td>\n<td>還沒拆頁（見 <a class=\"wl\" href=\"#todo\">待寫清單<\/a>）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>來源之間不一致的地方<\/h2>\n<ul>\n<li><strong>凹槽深度的 4 倍<\/strong>：Hubs 省錢文章寫「最大 XY 尺寸的 4 倍」，Hubs 設計指南寫「凹槽寬度的 4 倍」，Xometry 寫「槽的長度最多是深度的 4 倍」。三種寫法都照原文記在 <a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a>。<\/li>\n<li><strong>盲孔底部留多長不攻牙<\/strong>：Hubs 兩篇分別寫半個孔徑和 1.5 倍孔徑，見 <a class=\"wl\" href=\"#hole-thread\">孔與螺紋<\/a>。<\/li>\n<li><strong>標準公差<\/strong>：三家換算後都約 ±0.13 mm，但 ISO 2768 的公差會隨尺寸改變，「一般公差等於某個固定數字」只是近似，見 <a class=\"wl\" href=\"#general-tolerance\">一般公差<\/a>。<\/li>\n<\/ul>\n<h2>這一篇的來源<\/h2>\n<p>六份：四份來自 Protolabs 集團（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>、<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>、<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>），一份來自另一家公司（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>），一份是國際標準（<a class=\"wl\" href=\"#iso2768-1989\">一般公差標準 ISO 2768-1 1989<\/a>）。廠商文章是經驗法則，實際設計以合作工廠的建議為準。<\/p>", "back": ["batch-size", "cnc-milling", "hole-thread", "hubs-cost-2026", "hubs-design-2026", "internal-corner-radius", "machinability", "protolabs-cost-2026", "surface-finish", "thin-wall", "tolerance", "xometry-cost-2020"], "maybe": []}, "batch-size": {"title": "數量與開機成本", "type": "concept", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>寫程式、夾工件這些準備工作不管做幾件都要花，所以件數越多，每件分到的越少。<\/p>\n<h2>白話解釋<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"示意圖：每件單價隨件數下降。開機成本固定，件數越多，每件分到的越少，曲線先急降再變平\">\n<text x=\"20\" y=\"28\" class=\"f-h\">每件的價格 = 開機成本 ÷ 件數 ＋ 每件的加工費<\/text>\n<line x1=\"90\" y1=\"270\" x2=\"720\" y2=\"270\" class=\"f-zero\"/><line x1=\"90\" y1=\"50\" x2=\"90\" y2=\"270\" class=\"f-zero\"/>\n<rect x=\"90\" y=\"225\" width=\"630\" height=\"45\" class=\"f-hold\"/>\n<text x=\"600\" y=\"255\" class=\"f-lab\">每件的加工費（不會變少）<\/text>\n<path d=\"M100,60 C115,150 135,190 170,207 C230,218 330,222 450,224 C560,225 640,225 715,225\" class=\"f-b\" stroke-width=\"3\"/>\n<circle cx=\"100\" cy=\"60\" r=\"6\" class=\"f-kb\"/>\n<text x=\"112\" y=\"62\" class=\"f-lab\">做 1 件：開機成本全算在它身上<\/text>\n<circle cx=\"170\" cy=\"207\" r=\"6\" class=\"f-kb\"/>\n<text x=\"180\" y=\"196\" class=\"f-lab\">多做幾件，單價很快掉下來<\/text>\n<text x=\"520\" y=\"214\" class=\"f-lab\">再多，降幅就變小<\/text>\n<text x=\"40\" y=\"160\" class=\"f-tick\" transform=\"rotate(-90 40 160)\" text-anchor=\"middle\">每件價格<\/text>\n<text x=\"405\" y=\"295\" class=\"f-tick\" text-anchor=\"middle\">件數 →<\/text>\n<text x=\"20\" y=\"322\" class=\"f-note\">示意，非真實資料<\/text>\n<\/svg>\n<\/figure>\n<p>煮一鍋湯，不管煮 1 碗還是 10 碗，洗菜、開火、等水滾的時間都差不多。CNC 也一樣：每接一張單，都要先準備 CAD 檔、規劃加工流程（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）、寫程式、做裝夾（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）。這筆<strong>開機成本<\/strong>是固定的，做 1 件全部算在那 1 件上，做 100 件就分成 100 份（示意）。<\/p>\n<h2>解決什麼問題<\/h2>\n<p>解釋「為什麼打樣一件那麼貴、多訂幾件單價就掉很多」，讓下單的人知道合併訂單、一次多訂幾件可能更划算。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>一次多訂<\/strong>：從 1 件加到 5 件，單價約減半；1,000 件以上，單價可降 5–10 倍（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 14 招）。<\/li>\n<li>程式和裝夾的成本由更多件分攤，單價就降低（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a> 第 10 招）。<\/li>\n<li><strong>CNC 適合的量<\/strong>：Xometry 說 CNC 在 10,000 件以內最划算（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）。更大的量通常會考慮開模，這兩份來源沒有展開，先記進 <a class=\"wl\" href=\"#todo\">待寫清單<\/a>。<\/li>\n<li><strong>量少時看材料費，量多時看加工時間<\/strong>：少量訂單材料費佔比較重，選便宜的材料；量大時，好切的材料省下的時間才會贏回來（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 11 招，見 <a class=\"wl\" href=\"#machinability\">材料好不好切<\/a>）。<\/li>\n<\/ul>\n<h2>例子<\/h2>\n<p>示意：開機成本 3,000 元，每件加工 200 元。<\/p>\n<ul>\n<li>做 1 件：3,000 + 200 = 每件 3,200 元。<\/li>\n<li>做 10 件：(3,000 + 2,000) ÷ 10 = 每件 500 元。<\/li>\n<\/ul>\n<p>這些數字是編出來的，只是說明算法；真實的比例要看報價。<\/p>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#machine-setup\">裝夾次數與拆件<\/a>：裝夾就是開機成本的一部分<\/li>\n<li><a class=\"wl\" href=\"#machinability\">材料好不好切<\/a>：數量會改變材料怎麼選<\/li>\n<li><a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>：其他省錢規則<\/li>\n<\/ul>", "back": ["cnc-cost-guide", "cnc-milling", "machinability", "machine-setup"], "maybe": ["tolerance", "thin-wall", "surface-finish", "internal-corner-radius", "hole-thread"]}, "cavity-depth": {"title": "凹槽深度", "type": "concept", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>槽挖得越深，刀就要伸得越長、越容易晃，只能慢慢切，所以越貴。<\/p>\n<h2>白話解釋<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 340\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"示意圖：從側面切開看凹槽。左邊淺槽用短刀，很穩；右邊深槽要用伸很長的刀，容易晃\">\n<text x=\"20\" y=\"28\" class=\"f-h\">從側面切開看凹槽<\/text>\n<text x=\"60\" y=\"60\" class=\"f-lab\">淺槽：刀伸出短，穩<\/text>\n<path d=\"M40,200 L120,200 L120,240 L220,240 L220,200 L300,200 L300,300 L40,300 Z\" class=\"f-out\"/>\n<rect x=\"150\" y=\"110\" width=\"40\" height=\"128\" rx=\"3\" class=\"f-in\"/>\n<rect x=\"140\" y=\"80\" width=\"60\" height=\"30\" class=\"f-ka\"/>\n<text x=\"232\" y=\"226\" class=\"f-note\">深度小<\/text>\n<text x=\"420\" y=\"60\" class=\"f-lab\">深槽：刀伸很長，容易晃<\/text>\n<path d=\"M400,110 L520,110 L520,280 L600,280 L600,110 L720,110 L720,300 L400,300 Z\" class=\"f-out\"/>\n<path d=\"M552,80 C546,130 566,180 552,230 C546,250 560,265 556,278\" class=\"f-b\" stroke-width=\"18\" stroke-linecap=\"round\" opacity=\".55\"/>\n<rect x=\"530\" y=\"50\" width=\"60\" height=\"30\" class=\"f-ka\"/>\n<text x=\"610\" y=\"160\" class=\"f-lab\">刀晃 → 只能<\/text>\n<text x=\"610\" y=\"178\" class=\"f-lab\">慢慢切、尺寸不準<\/text>\n<line x1=\"740\" y1=\"110\" x2=\"740\" y2=\"280\" class=\"f-band\"/>\n<text x=\"700\" y=\"200\" class=\"f-note\" text-anchor=\"end\"><\/text>\n<text x=\"20\" y=\"330\" class=\"f-note\">示意，非真實尺寸。規則：深度最多約為槽最大 XY 尺寸的 4 倍；刀最舒服的工作深度約是刀徑的 2–3 倍（Hubs）<\/text>\n<\/svg>\n<\/figure>\n<p>拿一根筷子去攪碗底，筷子握得短，很穩；握在最尾端，一用力就晃。端銑刀也一樣：刀伸出來越長，切的時候越容易晃，工廠只好放慢、少切一點，或換特殊的長刀。<\/p>\n<p>另一個原因是材料量：槽越深，要挖掉的材料越多，本來就比較花時間（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 2 招）。<\/p>\n<h2>解決什麼問題<\/h2>\n<p>讓設計者知道「多深算太深」，在畫圖時就避開會讓刀晃、會讓零件變形的深槽。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>淺槽 vs. 深槽<\/strong>：深度最多畫到凹槽最大 XY 尺寸（從上往下看最長的那個方向）的 4 倍（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）。刀最好的工作深度約是直徑的 2–3 倍，12 mm 的刀大約能切到 25 mm 深（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）。<\/li>\n<li><strong>同一家也有兩種寫法<\/strong>：Hubs 的設計指南寫「凹槽寬度的 4 倍」（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>），比「最大 XY 尺寸的 4 倍」保守，因為寬度通常比最長的尺寸小。勉強可做的範圍：深銑可以超過刀徑 6 倍；用特殊刀具可以到 30:1，1 英吋的刀最深約 35 cm（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>）。<\/li>\n<li><strong>兩家的寫法方向相反<\/strong>：Xometry 原文寫「槽的長度最多是深度的 4 倍」，超過就要用容易斷的細長刀、分層往下切，或改用線切割這類更貴的方法（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a> 第 2 招）。字面上和 Hubs 的「深度最多是 XY 尺寸的 4 倍」方向相反；兩篇想講的都是「槽別太深」，Wiki 照原文兩個都記，實際設計時以工廠的建議為準。<\/li>\n<li><strong>鋼 vs. 鋁、塑膠<\/strong>：同樣的刀，鋁或塑膠可以切的深度是鋼的 2 倍（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/li>\n<li><strong>深槽 vs. 拆件<\/strong>：功能上一定要很深時，可以把零件拆成幾塊，各自加工後再組合（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 7 招、<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/li>\n<li>深槽即使加了清角，還是很耗時；而且槽和牆越深，原料裡的殘留應力越容易讓零件切完變形（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/li>\n<\/ul>\n<h2>例子<\/h2>\n<p>示意：一個從上往下看 20 × 10 mm 的口袋。最長的 XY 尺寸是 20 mm，照「4 倍」的規則最多挖 80 mm 深；但如果要用的刀直徑只有 8 mm，照「2–3 倍刀徑」的說法，超過 20 多 mm 就已經不是刀最舒服的範圍。兩條規則要一起看。<\/p>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>、<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#end-mill\">端銑刀<\/a>：刀的長度與直徑決定能挖多深<\/li>\n<li><a class=\"wl\" href=\"#internal-corner-radius\">內角圓角與清角<\/a>：槽越深，圓角也要跟著放大<\/li>\n<li><a class=\"wl\" href=\"#thin-wall\">薄牆與細高特徵<\/a>：深槽旁邊常常就是薄牆<\/li>\n<li><a class=\"wl\" href=\"#machine-setup\">裝夾次數與拆件<\/a>：太深的槽可以拆件解決<\/li>\n<\/ul>", "back": ["cnc-cost-guide", "cnc-milling", "end-mill", "hubs-design-2026", "internal-corner-radius", "machine-setup", "thin-wall"], "maybe": ["tolerance", "machinability", "hole-thread", "tap", "surface-finish"]}, "general-tolerance": {"title": "一般公差（ISO 2768）", "type": "concept", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>圖面上沒寫公差的尺寸，照標題欄寫的等級查表；最常見的是 ISO 2768-m。<\/p>\n<h2>白話解釋<\/h2>\n<p>一張圖面有幾十個尺寸，只有幾個真的重要。重要的尺寸旁邊會直接寫公差（例如 50 ± 0.02，示意）；其他的尺寸什麼都沒寫，這時就看圖面右下角的<strong>標題欄<\/strong>，常會看到一行「ISO 2768-m」。意思是：沒寫公差的尺寸，照 ISO 2768 這張表的「m（中級）」那一列（<a class=\"wl\" href=\"#iso2768-1989\">一般公差標準 ISO 2768-1 1989<\/a>）。<\/p>\n<p>這張表最重要的特點：<strong>尺寸越大，允許差越多<\/strong>。同樣是 m 級，6–30 mm 的尺寸允許 ±0.2 mm，30–120 mm 的尺寸允許 ±0.3 mm，120–400 mm 允許 ±0.5 mm（<a class=\"wl\" href=\"#iso2768-1989\">一般公差標準 ISO 2768-1 1989<\/a>）。<\/p>\n<h2>解決什麼問題<\/h2>\n<p>不用每個尺寸都寫公差，圖面乾淨好讀，設計者省時間，供應商下單前就知道要做到多準（<a class=\"wl\" href=\"#iso2768-1989\">一般公差標準 ISO 2768-1 1989<\/a>）。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>四個等級<\/strong>：f（精）、m（中）、c（粗）、v（最粗）。以 30–120 mm 的尺寸為例：f 級 ±0.15、m 級 ±0.3、c 級 ±0.8、v 級 ±1.5 mm（<a class=\"wl\" href=\"#iso2768-1989\">一般公差標準 ISO 2768-1 1989<\/a>）。<\/li>\n<li><strong>代工廠的預設<\/strong>：沒有另外標的話，Hubs 照 ISO 2768 的 m 或 f 級做（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>）；入門文章則說「大約 ±0.125 mm」（<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>）。這兩種說法不完全一樣，因為標準的公差會隨尺寸改變，不是固定一個數字。<\/li>\n<li><strong>超出了怎麼辦<\/strong>：標準說，超出一般公差但不影響功能的零件，不應該自動判退（<a class=\"wl\" href=\"#iso2768-1989\">一般公差標準 ISO 2768-1 1989<\/a>）。<\/li>\n<\/ul>\n<h2>例子<\/h2>\n<p>示意：標題欄寫 ISO 2768-m，圖上有一個沒寫公差的 80 mm 長度。80 落在 30–120 這一格，m 級是 ±0.3，所以量到 79.7 到 80.3 都合格。如果量到 80.5，先問：這個長度會不會影響組裝？<\/p>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#iso2768-1989\">一般公差標準 ISO 2768-1 1989<\/a>、<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>、<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#tolerance\">公差<\/a>：公差是什麼、為什麼越嚴越貴<\/li>\n<li><a class=\"wl\" href=\"#iso2768-1989\">一般公差標準 ISO 2768-1 1989<\/a>：完整的表<\/li>\n<\/ul>", "back": ["cnc-cost-guide", "iso2768-1989", "tolerance"], "maybe": ["thin-wall", "machine-setup", "cnc-milling"]}, "hole-thread": {"title": "孔與螺紋（標準孔徑、攻牙長度）", "type": "concept", "updated": "2026-11-27", "html": "<h2>一句話<\/h2>\n<p>孔用標準鑽頭的尺寸、螺紋別攻太深，就能一刀到位、少斷刀。<\/p>\n<h2>白話解釋<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"示意圖：左邊是通孔，右邊是盲孔。盲孔的螺紋長度約 3 倍孔徑就夠，底部留一段不攻牙\">\n<text x=\"20\" y=\"28\" class=\"f-h\">從側面切開看孔<\/text>\n<text x=\"60\" y=\"62\" class=\"f-lab\">通孔：穿過去<\/text>\n<rect x=\"40\" y=\"80\" width=\"90\" height=\"200\" class=\"f-out\"/><rect x=\"170\" y=\"80\" width=\"90\" height=\"200\" class=\"f-out\"/>\n<path d=\"M130,90 l40,10 M130,110 l40,10 M130,130 l40,10 M130,150 l40,10 M130,170 l40,10 M130,190 l40,10 M130,210 l40,10 M130,230 l40,10 M130,250 l40,10\" class=\"f-s\"/>\n<text x=\"40\" y=\"300\" class=\"f-note\">鐵屑從下面掉出去，好做<\/text>\n<text x=\"420\" y=\"62\" class=\"f-lab\">盲孔：有底<\/text>\n<path d=\"M400,80 L490,80 L490,250 L510,272 L530,250 L530,80 L620,80 L620,290 L400,290 Z\" class=\"f-out\"/>\n<path d=\"M490,90 l40,10 M490,110 l40,10 M490,130 l40,10 M490,150 l40,10 M490,170 l40,10 M490,190 l40,10\" class=\"f-s\"/>\n<rect x=\"490\" y=\"205\" width=\"40\" height=\"45\" class=\"f-hold\"/>\n<line x1=\"640\" y1=\"80\" x2=\"640\" y2=\"200\" class=\"f-a\"/><line x1=\"632\" y1=\"80\" x2=\"648\" y2=\"80\" class=\"f-a\"/><line x1=\"632\" y1=\"200\" x2=\"648\" y2=\"200\" class=\"f-a\"/>\n<text x=\"655\" y=\"135\" class=\"f-lab\">螺紋長度<\/text>\n<text x=\"655\" y=\"153\" class=\"f-lab\">約 3 倍孔徑就夠<\/text>\n<text x=\"655\" y=\"230\" class=\"f-lab\">底部留一段<\/text>\n<text x=\"655\" y=\"248\" class=\"f-lab\">不攻牙<\/text>\n<text x=\"420\" y=\"310\" class=\"f-note\">底部尖尖的是鑽頭留下的錐形<\/text>\n<text x=\"20\" y=\"318\" class=\"f-note\"><\/text>\n<text x=\"300\" y=\"300\" class=\"f-note\">示意，非真實尺寸<\/text>\n<\/svg>\n<\/figure>\n<p>先從你手上的 M6 螺絲接起：要讓 M6 螺絲鎖進一塊鋁板，板子上要先鑽一個孔，再用<strong>絲攻<\/strong>在孔壁上切出螺紋，這個動作叫<strong>攻牙<\/strong>。<\/p>\n<ul>\n<li><strong>通孔<\/strong>：從這一面穿到另一面的孔。<\/li>\n<li><strong>盲孔<\/strong>：沒有穿透、有底的孔。孔底用鑽頭鑽是錐形的，用端銑刀做是平的（<a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>）。盲孔的深度比較難控制，通孔比較好做（<a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>）。<\/li>\n<\/ul>\n<h2>解決什麼問題<\/h2>\n<p>孔和螺紋是零件上最常見的特徵。尺寸或深度訂得不好，工廠就要換刀、慢慢修、或冒著斷絲攻的風險，報價和交期都會變差。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>標準孔徑 vs. 特殊孔徑<\/strong>：標準鑽頭一次就能又快又準地鑽好；特殊尺寸要多一道工（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 5 招），要改用端銑刀或鉸刀，多花機器時間（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a> 第 6 招）。Hubs 的建議：10 mm 以下以 0.1 mm 為一級，10 mm 以上以 0.5 mm 為一級（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）；Xometry 舉的反例是 3.841 mm 這種尺寸（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）。<\/li>\n<li><strong>孔別太深<\/strong>：孔深最好不超過直徑的 4 倍；約 10 倍也做得到，但比較貴（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）。設計指南說最深可到直徑的 40 倍，一般是 10 倍（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>）。<\/li>\n<li><strong>孔底的形狀<\/strong>：用鑽頭鑽的盲孔，孔底是 135° 的錐形；用端銑刀做的孔底是平的（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>）。<\/li>\n<li><strong>螺紋別攻太深<\/strong>：兩份來源都說螺紋長度不超過孔徑的 3 倍（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 4 招、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a> 第 5 招）。原因：Hubs 說超過孔徑 1.5 倍之後，強度幾乎不再增加；Xometry 說只有前 2–3 牙在出力，攻太深絲攻容易斷。<\/li>\n<li><strong>盲孔底部為什麼要留一段不攻牙<\/strong>（見下圖）：<\/li>\n<li><strong>絲攻尖端切不出完整的牙<\/strong>：絲攻前端是削尖的。先攻有 6 到 7 個逐漸變細的切削齒，前面 10 牙可能沒完全成形，所以用先攻時孔要夠深（<a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>，詳見 <a class=\"wl\" href=\"#tap\">絲攻<\/a>）。<\/li>\n<li><strong>鑽頭留下的錐形<\/strong>：鑽頭鑽的孔底是錐形的（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>），那一段沒辦法攻牙。<\/li>\n<li><strong>切屑<\/strong>：攻牙時要轉一圈退半圈，不讓切屑堆積（<a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>）。「底部留空間放切屑」來源沒有直接說，是 Wiki 推論。<\/li>\n<\/ul>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 360\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"示意圖：左邊三支絲攻，先攻的尖端削尖得最長，後攻最短；右邊是盲孔，絲攻尖端那段切出的牙不完整，所以孔要比完整螺紋更深\">\n<text x=\"20\" y=\"28\" class=\"f-h\">絲攻的尖端是削尖的<\/text>\n<g>\n<text x=\"40\" y=\"62\" class=\"f-lab\">先攻<\/text>\n<path d=\"M45,80 L75,80 L75,215 L66,300 L54,300 L45,215 Z\" class=\"f-out\"/>\n<path d=\"M45,95 l30,8 M45,115 l30,8 M45,135 l30,8 M45,155 l30,8 M45,175 l30,8 M45,195 l30,8\" class=\"f-s\"/>\n<path d=\"M45,215 L54,300 L66,300 L75,215 Z\" class=\"f-hold\"/>\n<text x=\"20\" y=\"325\" class=\"f-note\">尖端長，好咬進去<\/text>\n<text x=\"140\" y=\"62\" class=\"f-lab\">中攻<\/text>\n<path d=\"M145,80 L175,80 L175,255 L168,300 L152,300 L145,255 Z\" class=\"f-out\"/>\n<path d=\"M145,95 l30,8 M145,115 l30,8 M145,135 l30,8 M145,155 l30,8 M145,175 l30,8 M145,195 l30,8 M145,215 l30,8 M145,235 l30,8\" class=\"f-s\"/>\n<path d=\"M145,255 L152,300 L168,300 L175,255 Z\" class=\"f-hold\"/>\n<text x=\"240\" y=\"62\" class=\"f-lab\">後攻<\/text>\n<path d=\"M245,80 L275,80 L275,285 L271,300 L249,300 L245,285 Z\" class=\"f-out\"/>\n<path d=\"M245,95 l30,8 M245,115 l30,8 M245,135 l30,8 M245,155 l30,8 M245,175 l30,8 M245,195 l30,8 M245,215 l30,8 M245,235 l30,8 M245,255 l30,8\" class=\"f-s\"/>\n<path d=\"M245,285 L249,300 L271,300 L275,285 Z\" class=\"f-hold\"/>\n<text x=\"215\" y=\"325\" class=\"f-note\">尖端短，牙做得到孔底<\/text>\n<\/g>\n<text x=\"20\" y=\"348\" class=\"f-note\">黃色：削尖的那一段，切出來的牙不完整<\/text>\n<line x1=\"345\" y1=\"45\" x2=\"345\" y2=\"335\" class=\"f-zero\"/>\n<text x=\"380\" y=\"62\" class=\"f-lab\">為什麼盲孔要鑽深一點<\/text>\n<path d=\"M380,80 L490,80 L490,285 L510,307 L530,285 L530,80 L640,80 L640,330 L380,330 Z\" class=\"f-out\"/>\n<path d=\"M490,95 l40,10 M490,115 l40,10 M490,135 l40,10 M490,155 l40,10 M490,175 l40,10 M490,195 l40,10\" class=\"f-s\"/>\n<path d=\"M490,215 l40,6 M490,235 l40,4\" class=\"f-s\" opacity=\".55\"/>\n<rect x=\"490\" y=\"212\" width=\"40\" height=\"38\" class=\"f-hold\"/>\n<line x1=\"655\" y1=\"80\" x2=\"655\" y2=\"210\" class=\"f-a\"/><line x1=\"647\" y1=\"80\" x2=\"663\" y2=\"80\" class=\"f-a\"/><line x1=\"647\" y1=\"210\" x2=\"663\" y2=\"210\" class=\"f-a\"/>\n<text x=\"668\" y=\"140\" class=\"f-lab\">完整的牙<\/text>\n<text x=\"668\" y=\"158\" class=\"f-lab\">（真正出力）<\/text>\n<text x=\"668\" y=\"228\" class=\"f-lab\">絲攻尖端：<\/text>\n<text x=\"668\" y=\"246\" class=\"f-lab\">牙不完整<\/text>\n<text x=\"668\" y=\"292\" class=\"f-lab\">鑽頭的錐形<\/text>\n<text x=\"668\" y=\"310\" class=\"f-lab\">攻不到牙<\/text>\n<text x=\"380\" y=\"352\" class=\"f-note\">示意，非真實尺寸<\/text>\n<\/svg>\n<\/figure>\n<ul>\n<li><strong>盲孔留底<\/strong>：盲孔底部要留至少半個孔徑不攻牙（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）；設計指南寫 M6 以下的盲孔要留 1.5 倍直徑（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>）。同一家兩篇寫的不一樣，小螺紋照比較長的留比較保險（Wiki 推論）。<\/li>\n<li><strong>螺紋大小<\/strong>：建議 M6 以上；有時可以小到 M1；螺紋長度最少要 1.5 倍直徑（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>）。<\/li>\n<li><strong>標準螺紋<\/strong>：用標準螺紋尺寸，交期短、成本低（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）；太小的螺紋（美制 2-56 以下）要手工攻牙（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）。<\/li>\n<\/ul>\n<h2>例子<\/h2>\n<p>示意：一塊 20 mm 厚的鋁板要鎖 M6 螺絲。<\/p>\n<ul>\n<li>螺紋長度畫 18 mm（孔徑 6 mm 的 3 倍）就夠了，不用整個 20 mm 都攻牙。<\/li>\n<li>如果是盲孔，孔底再多鑽 3 mm（半個孔徑）不攻牙。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>、<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>、<a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#tap\">絲攻<\/a>：攻牙用的刀，尖端為什麼切不完整<\/li>\n<li><a class=\"wl\" href=\"#end-mill\">端銑刀<\/a>：非標準孔徑要改用端銑刀慢慢修<\/li>\n<li><a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>：孔是在銑床上鑽的<\/li>\n<li><a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>：其他省錢規則<\/li>\n<\/ul>", "back": ["cnc-cost-guide", "cnc-milling", "end-mill", "rapiddirect-threads-2022", "tap"], "maybe": ["tolerance", "thin-wall", "machine-setup", "internal-corner-radius", "cavity-depth"]}, "internal-corner-radius": {"title": "內角圓角與清角", "type": "concept", "updated": "2026-11-27", "html": "<h2>一句話<\/h2>\n<p>刀是圓的，挖出來的凹槽角落一定是圓的；圓角畫大一點，就能用大刀切得更快。<\/p>\n<h2>白話解釋<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 520 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"示意圖：從上往下看凹槽的一個角。左：圖面畫尖角，圓刀碰不到角落；右：圓角等於刀的半徑\">\n<text x=\"20\" y=\"28\" class=\"f-h\">從上往下看凹槽的一個角落<\/text>\n<text x=\"40\" y=\"62\" class=\"f-lab\">① 圖面畫尖角<\/text>\n<path d=\"M40,300 L40,90 L230,90\" class=\"f-a\"/>\n<path d=\"M40,90 L80,90 A40,40 0 0,0 40,130 Z\" class=\"f-hold\"/>\n<circle cx=\"80\" cy=\"130\" r=\"40\" class=\"f-out\"/>\n<circle cx=\"80\" cy=\"130\" r=\"3\" class=\"f-ka\"/>\n<text x=\"130\" y=\"135\" class=\"f-lab\">圓刀碰不到角落<\/text>\n<text x=\"130\" y=\"153\" class=\"f-lab\">（黃色那塊切不到）<\/text>\n<text x=\"40\" y=\"200\" class=\"f-note\">要尖角只能換很小的刀，<\/text>\n<text x=\"40\" y=\"216\" class=\"f-note\">或用放電加工，又慢又貴<\/text>\n<text x=\"290\" y=\"62\" class=\"f-lab\">② 圓角 = 刀的半徑<\/text>\n<path d=\"M290,300 L290,130 A40,40 0 0,1 330,90 L480,90\" class=\"f-b\"/>\n<circle cx=\"330\" cy=\"130\" r=\"40\" class=\"f-out\" opacity=\".5\"/>\n<line x1=\"330\" y1=\"130\" x2=\"301.7\" y2=\"101.7\" class=\"f-s\"/>\n<text x=\"338\" y=\"150\" class=\"f-lab\">R = 刀的半徑<\/text>\n<text x=\"290\" y=\"200\" class=\"f-note\">圓角畫大一點，<\/text>\n<text x=\"290\" y=\"216\" class=\"f-note\">就能用大刀切得快<\/text>\n<text x=\"20\" y=\"322\" class=\"f-note\">示意，非真實尺寸<\/text>\n<\/svg>\n<\/figure>\n<p>想像用一枚硬幣在沙盤裡畫一個方框：不管怎麼推，硬幣都碰不到方框最尖的角，角落一定留下一個圓弧。端銑刀就是那枚硬幣（<a class=\"wl\" href=\"#end-mill\">端銑刀<\/a>）。<\/p>\n<ul>\n<li><strong>內角圓角<\/strong>：凹槽「從上往下看」的四個角，被刀切出來的圓弧。圓角半徑最小只能等於刀的半徑。<\/li>\n<li><strong>清角<\/strong>：真的需要尖角（例如要塞一塊方形零件進去）時，不把圓角縮小，而是在角落多挖一個小洞，讓方形零件的角有地方放。<\/li>\n<\/ul>\n<p>像抽屜的角是圓的，方形盒子的尖角會先頂到圓角，推不到底、兩邊留縫；在角落挖個小洞，盒子就能貼著兩面牆塞到底：<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 370\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"示意圖：從上往下看凹槽角落。左：角落是圓的，方形零件的尖角頂到圓角，兩邊留縫推不到底。右：角落多挖一個小洞（清角），零件尖角伸進洞裡，兩邊都貼到牆\">\n<text x=\"20\" y=\"28\" class=\"f-h\">為什麼要清角：把方形零件放進凹槽（從上往下看）<\/text>\n<text x=\"70\" y=\"62\" class=\"f-lab\">只有圓角：卡住<\/text>\n<rect x=\"70\" y=\"75\" width=\"260\" height=\"230\" class=\"f-ka\" opacity=\".14\"/>\n<path d=\"M110,305 L110,155 A40,40 0 0,1 150,115 L330,115 L330,305 Z\" class=\"f-out\"/>\n<rect x=\"110\" y=\"155\" width=\"12\" height=\"122\" class=\"f-kb\"/>\n<rect x=\"150\" y=\"115\" width=\"122\" height=\"12\" class=\"f-kb\"/>\n<rect x=\"122\" y=\"127\" width=\"150\" height=\"150\" class=\"f-in\"/>\n<text x=\"150\" y=\"208\" class=\"f-lab\">方形零件<\/text>\n<text x=\"70\" y=\"330\" class=\"f-lab\">尖角頂到圓角，藍色是縫，<\/text>\n<text x=\"70\" y=\"348\" class=\"f-lab\">零件推不到底<\/text>\n<text x=\"420\" y=\"62\" class=\"f-lab\">加了清角：塞到底<\/text>\n<rect x=\"420\" y=\"75\" width=\"260\" height=\"230\" class=\"f-ka\" opacity=\".14\"/>\n<path d=\"M460,305 L460,137 A22,22 0 1,1 482,115 L680,115 L680,305 Z\" class=\"f-out\"/>\n<rect x=\"460\" y=\"115\" width=\"150\" height=\"150\" class=\"f-in\"/>\n<text x=\"490\" y=\"196\" class=\"f-lab\">方形零件<\/text>\n<text x=\"420\" y=\"330\" class=\"f-lab\">角落多挖一個小洞（清角），<\/text>\n<text x=\"420\" y=\"348\" class=\"f-lab\">尖角伸進洞裡，兩邊都貼牆<\/text>\n<text x=\"700\" y=\"362\" class=\"f-note\" text-anchor=\"end\">灰色是材料、白色是挖掉的凹槽。示意，非真實尺寸<\/text>\n<\/svg>\n<\/figure>\n<h2>解決什麼問題<\/h2>\n<p>圖面畫了尖的內角，工廠只有兩條路：用很小的刀慢慢切（還是有小圓角），或用放電加工、拼板這些又慢又貴的方法（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。把圓角畫大，或改用清角，就不會卡在這裡。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>大圓角 vs. 小圓角<\/strong>：圓角半徑至少畫到凹槽深度的 1/3，所有內角用同一個半徑，工廠就能用大刀、不用換刀（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 1 招）。例：12 mm 深的槽用 5 mm 以上圓角，就能用 8 mm 的刀（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）。<\/li>\n<li><strong>清角 vs. 縮小圓角<\/strong>：縮小圓角得換小刀，0.8 mm 的刀只能留到 0.4 mm 的圓角，而且切不深；在每個角切 6.35 mm 寬的清角，功能上是尖角的槽可以深到約 32 mm（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/li>\n<li><strong>槽底<\/strong>：槽底（往下看不到的那條邊）用 0.5 或 1 mm 的小圓角，或乾脆不加（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）；槽底要什麼半徑都做得到，只是要換球刀（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>）。<\/li>\n<li><strong>第三家也這樣說<\/strong>：Xometry 同樣建議內角做圓角、所有內角半徑一致以免換刀；原文寫圓角的長度比直徑（L:D）保持在 3:1 以內，但沒說 L 和 D 各指什麼（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a> 第 1 招）。前兩份來源都屬於 Protolabs 集團，Xometry 是另一家公司，可以當獨立的對照。<\/li>\n<\/ul>\n<h2>例子<\/h2>\n<p>示意：你要做一個深 15 mm 的口袋，裡面要放一塊方形的感測器。<\/p>\n<ul>\n<li>只放得下就好、角落不用貼齊 → 圓角畫 R5（15 的 1/3），最便宜。<\/li>\n<li>方形感測器的角一定要塞到底 → 不要畫尖角，改在四個角畫清角。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>、<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#end-mill\">端銑刀<\/a>：圓角的大小是刀決定的<\/li>\n<li><a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a>：圓角要跟著槽的深度一起放大<\/li>\n<li><a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>：其他省錢規則<\/li>\n<\/ul>", "back": ["cavity-depth", "cnc-cost-guide", "cnc-milling", "end-mill", "protolabs-cost-2026"], "maybe": ["tolerance", "thin-wall", "machine-setup", "machinability", "hole-thread"]}, "machinability": {"title": "材料好不好切（可切削性）", "type": "concept", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>同一個形狀，換成好切的材料，刀可以走得快、磨損少，加工時間就短。<\/p>\n<h2>白話解釋<\/h2>\n<p>切豆腐和切冷凍肉，用的是同一把刀，花的力氣和時間完全不同。金屬也有「豆腐」和「冷凍肉」：黃銅、鋁很好切；不鏽鋼比較硬、比較黏刀，要慢慢切。<\/p>\n<p><strong>可切削性<\/strong>就是「這個材料好不好切」的分數。常見做法是拿一個基準材料當 100%，數字越高越好切（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 沒有寫基準是哪個材料）。<\/p>\n<h2>解決什麼問題<\/h2>\n<p>材料常常是設計時順手選的，但它同時決定了材料費和加工時間。這條規則提醒設計者：功能允許的話，選一個好切、又便宜的材料。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>好切的金屬<\/strong>：C360 黃銅最好切；6061、7075 鋁很容易；不鏽鋼常要花鋁的 2 倍以上時間。304 不鏽鋼的可切削指數約 45%，303 約 78%（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 10 招）。<\/li>\n<li><strong>好切的塑膠<\/strong>：POM（Delrin）最好切，ABS 其次；PEEK、尼龍 6 比較難（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）。比較軟的塑膠尺寸容易不穩、切口會牽絲（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/li>\n<li><strong>材料費<\/strong>：同樣 150×150×25 mm 的板，6061 鋁約 25 美元、304 不鏽鋼約 90 美元、PEEK 約 300 美元（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 11 招）。<\/li>\n<li><strong>替代材料<\/strong>：17-4 PH 不鏽鋼很難切，不需要那麼強、那麼耐蝕時可改 316L 或 304；銅很貴，鋁的導電度約是銅的 60%，又輕又便宜（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/li>\n<li><strong>軟一點的金屬<\/strong>：6061 鋁原料便宜、切得快、刀磨得少；硬材料要更貴的刀，刀也更常斷。6061 太軟的話，可以考慮好切的低碳鋼（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a> 第 7 招）。<\/li>\n<li><strong>好切但貴 vs. 便宜但難切<\/strong>：303 不鏽鋼比 304 好切，但板材貴（150 vs. 90 美元，<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）。量少時材料費比較重要；量大時，加工時間省下來的錢才會贏過去（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 11 招）。<\/li>\n<\/ul>\n<h2>例子<\/h2>\n<p>示意：做 3 個打樣用的支架，只要不生鏽、不要求很強，選 6061 鋁通常最省；如果之後要做 1,000 個，又一定要不鏽鋼，就值得問工廠 303 和 304 哪個總價比較低。<\/p>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>：材料好不好切，直接影響銑削的時間<\/li>\n<li><a class=\"wl\" href=\"#batch-size\">數量與開機成本<\/a>：數量多寡會改變材料怎麼選<\/li>\n<li><a class=\"wl\" href=\"#surface-finish\">表面處理<\/a>：材料也決定能做哪些表面處理<\/li>\n<li><a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>：其他省錢規則<\/li>\n<\/ul>", "back": ["batch-size", "cnc-cost-guide", "cnc-milling", "surface-finish"], "maybe": ["tolerance", "thin-wall", "machine-setup", "internal-corner-radius", "cavity-depth"]}, "machine-setup": {"title": "裝夾次數與拆件", "type": "concept", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>工件每翻一次面就要重新夾、重新對位，花人工也容易出錯；能一次夾完最省。<\/p>\n<h2>白話解釋<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"示意圖：零件兩面都有孔時，第一次裝夾做上面的孔，拆下翻面，第二次裝夾再做另一面的孔\">\n<defs><marker id=\"ms-ar\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"f-ka\"/><\/marker><\/defs>\n<text x=\"20\" y=\"28\" class=\"f-h\">兩面都有孔 → 要裝夾兩次（刀只能從上面下來）<\/text>\n<text x=\"60\" y=\"62\" class=\"f-lab\">第 1 次裝夾：做上面的孔<\/text>\n<rect x=\"60\" y=\"170\" width=\"220\" height=\"60\" class=\"f-out\"/>\n<rect x=\"105\" y=\"170\" width=\"18\" height=\"30\" class=\"f-hold\"/><rect x=\"215\" y=\"170\" width=\"18\" height=\"30\" class=\"f-hold\"/>\n<rect x=\"60\" y=\"230\" width=\"220\" height=\"16\" class=\"f-ka\"/><rect x=\"40\" y=\"185\" width=\"20\" height=\"45\" class=\"f-ka\"/><rect x=\"280\" y=\"185\" width=\"20\" height=\"45\" class=\"f-ka\"/>\n<rect x=\"105\" y=\"80\" width=\"18\" height=\"80\" class=\"f-in\"/>\n<text x=\"60\" y=\"270\" class=\"f-note\">黑色是夾具（虎鉗）<\/text>\n<path d=\"M320,200 C360,150 400,150 440,200\" class=\"f-a\" marker-end=\"url(#ms-ar)\"/>\n<text x=\"330\" y=\"140\" class=\"f-lab\">停機、拆下、翻面<\/text>\n<text x=\"330\" y=\"158\" class=\"f-lab\">重新夾、重新對位<\/text>\n<text x=\"470\" y=\"62\" class=\"f-lab\">第 2 次裝夾：做另一面的孔<\/text>\n<rect x=\"470\" y=\"170\" width=\"220\" height=\"60\" class=\"f-out\"/>\n<rect x=\"515\" y=\"200\" width=\"18\" height=\"30\" class=\"f-hold\"/><rect x=\"625\" y=\"200\" width=\"18\" height=\"30\" class=\"f-hold\"/>\n<rect x=\"570\" y=\"170\" width=\"18\" height=\"30\" class=\"f-hold\"/>\n<rect x=\"470\" y=\"230\" width=\"220\" height=\"16\" class=\"f-ka\"/><rect x=\"450\" y=\"185\" width=\"20\" height=\"45\" class=\"f-ka\"/><rect x=\"690\" y=\"185\" width=\"20\" height=\"45\" class=\"f-ka\"/>\n<rect x=\"570\" y=\"80\" width=\"18\" height=\"80\" class=\"f-in\"/>\n<text x=\"470\" y=\"270\" class=\"f-note\">翻過來後，原本的孔在下面<\/text>\n<text x=\"20\" y=\"310\" class=\"f-note\">示意，非真實尺寸。每多一次裝夾：多一次人工，兩面之間的位置也多一點誤差<\/text>\n<\/svg>\n<\/figure>\n<p><strong>裝夾<\/strong>（setup）就是把工件固定在機台上，並告訴機器「工件在哪裡」。一般的 3 軸銑床，刀只能從上面下來（<a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>），所以零件的底面、側面如果也有孔或槽，就要停機、把工件拆下來、翻面、再夾一次、再對一次位置。<\/p>\n<p>每多一次裝夾：多一次人工、可能要做專用的夾具，而且兩面之間的位置會多一點誤差。<\/p>\n<h2>解決什麼問題<\/h2>\n<p>讓設計者把特徵集中在少數幾個方向上，減少翻面次數。真的做不到時，用「拆件」換掉「多面加工」。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>一次裝夾<\/strong>：目標是一次夾完、形狀是簡單的 2.5D（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 7 招）。例：零件兩面都有盲孔，就要裝夾兩次（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）。<\/li>\n<li><strong>為什麼貴<\/strong>：重新定位多半是人工，形狀複雜時要做專用夾具（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）；多面加工會增加夾治具和裝夾的時間（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a> 第 9 招）。<\/li>\n<li><strong>拆件 vs. 一體<\/strong>：一次裝夾做不完，可以拆成幾個零件分開加工，再用螺絲鎖、或焊接組合（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）。拆件多了組裝成本，但難做的零件常常還是划算（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/li>\n<li><strong>幾次算多<\/strong>：每轉一次都要重新校正、重新定座標；轉 3 到 4 次通常還可以接受。位置關係要求很準的特徵，要在同一次裝夾裡做完（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>）。<\/li>\n<li><strong>5 軸機<\/strong>：多了兩個旋轉方向，可以減少或省掉翻面，但比較貴；刀伸不到的內部形狀還是做不出來（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>、<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>）。<\/li>\n<\/ul>\n<h2>例子<\/h2>\n<p>示意：一個 L 形支架，上面有 2 個孔、側面有 1 個孔。<\/p>\n<ul>\n<li>照原樣：上面做完要轉 90° 再夾一次做側面孔 → 2 次裝夾。<\/li>\n<li>如果側面孔可以改成從上面打穿、或乾脆改到上面 → 1 次裝夾。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>、<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>、<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>：刀從上面下來，所以才需要翻面<\/li>\n<li><a class=\"wl\" href=\"#tolerance\">公差<\/a>：位置要很準的特徵，放在同一次裝夾裡做<\/li>\n<li><a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a>：太深的槽也可以用拆件解決<\/li>\n<li><a class=\"wl\" href=\"#batch-size\">數量與開機成本<\/a>：裝夾是開機成本的一部分<\/li>\n<\/ul>", "back": ["batch-size", "cavity-depth", "cnc-cost-guide", "cnc-milling", "hubs-design-2026", "tolerance"], "maybe": ["thin-wall", "internal-corner-radius", "surface-finish", "machinability", "hole-thread"]}, "surface-finish": {"title": "表面處理", "type": "concept", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>零件切完之後再加的一層處理；一個零件混用好幾種，就要多做好幾道工。<\/p>\n<h2>白話解釋<\/h2>\n<p>零件切完的樣子叫「切削原樣」（as machined），表面會有刀走過的細紋。為了好看、防鏽、耐磨，常會再做<strong>表面處理<\/strong>，例如：<\/p>\n<ul>\n<li><strong>陽極處理<\/strong>：鋁件常用，在表面長一層硬的氧化膜，可以染色。<\/li>\n<li><strong>化成皮膜<\/strong>：一種很薄的化學處理，常用來防腐蝕、又保持導電。<\/li>\n<li><strong>噴砂<\/strong>：用細砂打表面，變成霧面，把刀紋藏起來。<\/li>\n<\/ul>\n<h2>解決什麼問題<\/h2>\n<p>表面處理本身解決防鏽、外觀、耐磨的問題；這條省錢規則解決的是「同一個零件混用多種處理」造成的額外工序。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>單一處理 vs. 多種處理<\/strong>：每一種處理都要錢，多種處理還要多做遮蔽這類步驟（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 12 招）。例如同一個零件又要陽極處理又要化成皮膜、又要拋光又要噴砂，都會多出製程（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a> 第 8 招）。<\/li>\n<li><strong>切削原樣<\/strong>：能接受的話，直接用切完的樣子最便宜（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>），或統一一種處理（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）。<\/li>\n<li><strong>切完有多光<\/strong>：表面粗糙度（表面的細小高低起伏）銑削件約 3.2 µm，新機器約 1.6 µm；車削件約 0.8 µm（<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>）。數字越小越光滑。<\/li>\n<li>不確定要不要處理時，Xometry 建議把零件的用途告訴窗口，讓對方判斷（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）。<\/li>\n<\/ul>\n<h2>例子<\/h2>\n<p>示意：一個鋁外殼，外面要黑色陽極處理，裡面有一塊要接地導電，所以要遮住不處理。這個「遮住」就是多出來的工；如果接地改用其他方式（例如鎖一顆接地螺絲刮開表面），整個零件可以只做一種處理。<\/p>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>、<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#machinability\">材料好不好切<\/a>：材料選擇也會決定能做哪些處理<\/li>\n<li><a class=\"wl\" href=\"#cnc-turning\">CNC 車削<\/a>：車削件切完通常比銑削件光<\/li>\n<li><a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>：其他省錢規則<\/li>\n<\/ul>", "back": ["cnc-cost-guide", "cnc-milling", "cnc-turning", "hubs-cnc-basics-2026", "machinability"], "maybe": ["thin-wall", "machine-setup", "tolerance", "internal-corner-radius", "hole-thread"]}, "thin-wall": {"title": "薄牆與細高特徵", "type": "concept", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>牆越薄、柱子越細高，切的時候越會抖，只能慢慢切，還可能斷或翹。<\/p>\n<h2>白話解釋<\/h2>\n<p>用刀削一片很薄的餅乾，一用力就斷；就算沒斷，餅乾也會跟著刀一起晃，削不平。金屬的薄牆也是這樣：刀碰到它時，它會被推開又彈回來，工廠只好分好幾次、每次只削一點點（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 3 招）。<\/p>\n<p>細高的小特徵（例如一根細細的小柱子）是同一個問題：越細越高，越容易晃（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 8 招）。<\/p>\n<h2>解決什麼問題<\/h2>\n<p>讓設計者知道牆至少要多厚，避免零件切壞、切完變形，也避免為了一道薄牆把整個零件的加工速度拖慢。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>建議的最小牆厚<\/strong>：金屬 0.8 mm 以上、塑膠 1.5 mm 以上；勉強能做到金屬約 0.5 mm、塑膠約 1.0 mm，但要個案評估（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）。<\/li>\n<li>Protolabs 的報價軟體把 0.51 mm 以下的特徵標成薄牆：還是能做，但成品可能跟設計有點出入；切完也可能彎或翹（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/li>\n<li>同一家的入門文章，金屬最小牆厚在內文寫 0.8 mm、在表格寫 0.75 mm，自己前後不一致（<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>）；設計指南和省錢文章都寫 0.8 mm（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>）。<\/li>\n<li>Xometry 的最小牆厚是 1/32 英吋（0.794 mm），和 Hubs 的 0.8 mm 幾乎一樣（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a> 第 4 招）。<\/li>\n<li><strong>CNC vs. 板金<\/strong>：牆真的很薄的零件，改用板金折出來通常比較划算（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）。<\/li>\n<li><strong>加厚 vs. 加肋<\/strong>：不在意重量的話，直接加厚最便宜；加肋（補強的小牆）可以防變形，但肋本身也要加工，又多了成本（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）。<\/li>\n<li>細高的小特徵，原文寫寬高比保持在 4:1 以內，或把它連到旁邊的牆上增加剛性（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）。<\/li>\n<\/ul>\n<h2>例子<\/h2>\n<p>示意：一個鋁盒子，側牆畫 0.6 mm。比建議的 0.8 mm 薄，工廠多半做得出來，但會切得很慢、報價變高，牆也可能有點波浪。如果改成 1.0 mm，重量增加很少，報價可能明顯下降。<\/p>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>、<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>、<a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#cavity-depth\">凹槽深度<\/a>：深槽旁邊常常就是又高又薄的牆<\/li>\n<li><a class=\"wl\" href=\"#end-mill\">端銑刀<\/a>：刀也會晃，兩者疊加更難做<\/li>\n<li><a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>：其他省錢規則<\/li>\n<\/ul>", "back": ["cavity-depth", "cnc-cost-guide", "cnc-milling", "end-mill"], "maybe": ["machine-setup", "tolerance", "internal-corner-radius", "surface-finish", "machinability"]}, "tolerance": {"title": "公差", "type": "concept", "updated": "2026-11-25", "html": "<h2>一句話<\/h2>\n<p>公差是「尺寸可以差多少」：允許差得越少，就要切得越慢、量得越多，越貴。<\/p>\n<h2>白話解釋<\/h2>\n<figure class=\"fig\"><svg viewBox=\"0 0 760 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" class=\"fig-svg\" aria-label=\"示意圖：公差像停車格。上面是寬的公差帶，下面是窄的公差帶；做出來的尺寸落在帶子裡就合格，帶子越窄越難、越貴\">\n<text x=\"20\" y=\"28\" class=\"f-h\">公差像停車格：尺寸落在格子裡就合格<\/text>\n<text x=\"40\" y=\"70\" class=\"f-lab\">寬的公差（例如 ±0.1）<\/text>\n<rect x=\"230\" y=\"50\" width=\"300\" height=\"40\" class=\"f-hold\"/>\n<line x1=\"380\" y1=\"44\" x2=\"380\" y2=\"96\" class=\"f-band\"/>\n<line x1=\"230\" y1=\"50\" x2=\"230\" y2=\"90\" class=\"f-a\"/><line x1=\"530\" y1=\"50\" x2=\"530\" y2=\"90\" class=\"f-a\"/>\n<circle cx=\"300\" cy=\"70\" r=\"7\" class=\"f-kb\"/><circle cx=\"410\" cy=\"70\" r=\"7\" class=\"f-kb\"/><circle cx=\"490\" cy=\"70\" r=\"7\" class=\"f-kb\"/>\n<text x=\"545\" y=\"75\" class=\"f-lab\">好停：照平常速度切<\/text>\n<text x=\"40\" y=\"170\" class=\"f-lab\">窄的公差（例如 ±0.02）<\/text>\n<rect x=\"350\" y=\"150\" width=\"60\" height=\"40\" class=\"f-hold\"/>\n<line x1=\"380\" y1=\"144\" x2=\"380\" y2=\"196\" class=\"f-band\"/>\n<line x1=\"350\" y1=\"150\" x2=\"350\" y2=\"190\" class=\"f-a\"/><line x1=\"410\" y1=\"150\" x2=\"410\" y2=\"190\" class=\"f-a\"/>\n<circle cx=\"370\" cy=\"170\" r=\"7\" class=\"f-kb\"/><circle cx=\"300\" cy=\"170\" r=\"7\" class=\"f-ka\"/><circle cx=\"470\" cy=\"170\" r=\"7\" class=\"f-ka\"/>\n<text x=\"425\" y=\"175\" class=\"f-lab\">難停：要慢慢切、多量幾次<\/text>\n<text x=\"250\" y=\"215\" class=\"f-note\">黑點：超出格子，不合格<\/text>\n<text x=\"380\" y=\"240\" class=\"f-tick\" text-anchor=\"middle\">圖面上的尺寸（例如 50）<\/text>\n<text x=\"20\" y=\"290\" class=\"f-note\">示意，非真實尺寸。藍點是合格的零件，黑點是不合格的零件<\/text>\n<\/svg>\n<\/figure>\n<p>停車格就是一種公差：車子不必停在正中央，只要停在白線裡面都算對。圖面上寫「50 ± 0.1」，意思是做出來在 49.9 到 50.1 之間都合格（示意）。白線畫得越窄，停車越要小心，花的時間越多。<\/p>\n<ul>\n<li><strong>標準公差<\/strong>：圖面沒寫公差的尺寸，工廠照自己平常的精度做。<\/li>\n<li><strong>基準（datum）<\/strong>：量尺寸的起點，例如零件的某一個角。所有尺寸從同一個起點量，誤差才不會一路累加。<\/li>\n<\/ul>\n<h2>解決什麼問題<\/h2>\n<p>零件要能裝得上、轉得動、對得準，某些尺寸一定要準；但不是每個尺寸都要那麼準。公差讓設計者只在需要的地方要求精度，其他地方放寬，省時間也省錢。<\/p>\n<h2>為什麼選它<\/h2>\n<ul>\n<li><strong>只標必要的公差<\/strong>：三份來源都說，只有關鍵特徵才標公差，其他交給標準公差（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a> 第 6 招、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a> 第 3 招）。<\/li>\n<li><strong>三家的標準公差幾乎一樣<\/strong>：Hubs 寫 ±0.125 mm 或更好（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>）；Protolabs 寫 ±0.13 mm（<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>）；Xometry 寫 ±0.005 英吋（<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>），換算約 ±0.127 mm（Wiki 的算術）。<\/li>\n<li><strong>一般做得到 vs. 勉強做得到<\/strong>：一般 ±0.1 mm，最嚴約 ±0.02 mm（<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>）。<\/li>\n<li><strong>沒寫公差的尺寸<\/strong>：照圖面標題欄寫的一般公差等級，最常見的是 ISO 2768-m，見 <a class=\"wl\" href=\"#general-tolerance\">一般公差<\/a>。<\/li>\n<li><strong>用同一個基準<\/strong>：所有標公差的尺寸從同一個基準量（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>）。<\/li>\n<li><strong>GD&amp;T<\/strong>（幾何公差，用符號控制平面度、位置等）可以在放寬尺寸公差的同時守住功能，但需要比較進階的知識（<a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>），這裡先不展開。<\/li>\n<\/ul>\n<h2>例子<\/h2>\n<p>示意：一塊固定板上有兩個孔，要對準另一塊板上的兩根銷。<\/p>\n<ul>\n<li>兩孔之間的距離 → 標公差，而且兩個孔都從同一個基準量。<\/li>\n<li>外形的長寬、倒角大小 → 不標，用工廠的標準公差就好。<\/li>\n<\/ul>\n<h2>出現在哪些來源<\/h2>\n<p><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>、<a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>、<a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>、<a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a><\/p>\n<h2>相關頁面<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#general-tolerance\">一般公差<\/a>：沒寫公差的尺寸照哪張表<\/li>\n<li><a class=\"wl\" href=\"#iso2768-1989\">一般公差標準 ISO 2768-1 1989<\/a>：一般公差的原始標準<\/li>\n<li><a class=\"wl\" href=\"#machine-setup\">裝夾次數與拆件<\/a>：要求位置很準的特徵，最好在同一次裝夾裡做完<\/li>\n<li><a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a>：其他省錢規則<\/li>\n<\/ul>", "back": ["cnc-cost-guide", "cnc-milling", "general-tolerance", "hubs-design-2026", "iso2768-1989", "machine-setup"], "maybe": ["thin-wall", "internal-corner-radius", "cavity-depth", "machinability", "hole-thread"]}, "index": {"title": "目錄", "type": "overview", "updated": "自動產生", "html": "<p>核心問題：<strong>它在解決什麼問題？為什麼選它，不選別的？<\/strong> 從第一個主題 <a class=\"wl\" href=\"#cnc-cost-guide\">CNC 省錢篇：零件到底貴在哪裡<\/a> 開始。<\/p>\n<blockquote>\n<p>這一頁由 <code>tools/gen_index.py<\/code> 自動產生，請不要手改。<\/p>\n<\/blockquote>\n<h2>來源（sources）<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#iso2768-1989\">一般公差標準 ISO 2768-1 1989<\/a>：一般公差標準 ISO 2768-1（1989）<\/li>\n<li><a class=\"wl\" href=\"#xometry-cost-2020\">降低 CNC 加工成本的十個方法 2020<\/a>：降低 CNC 加工成本的十個方法（Xometry，Lichtig 2020）<\/li>\n<li><a class=\"wl\" href=\"#rapiddirect-threads-2022\">螺紋孔：種類、做法與注意事項 2022<\/a>：螺紋孔：種類、做法與注意事項（RapidDirect，Chan 2022）<\/li>\n<li><a class=\"wl\" href=\"#hubs-cnc-basics-2026\">什麼是 CNC 加工 2026<\/a>：什麼是 CNC 加工（Protolabs Network／Hubs）<\/li>\n<li><a class=\"wl\" href=\"#hubs-cost-2026\">CNC 加工省錢的 14 個設計技巧 2026<\/a>：CNC 加工省錢的 14 個設計技巧（Protolabs Network／Hubs）<\/li>\n<li><a class=\"wl\" href=\"#hubs-design-2026\">CNC 零件設計指南 2026<\/a>：CNC 零件設計指南（Protolabs Network／Hubs）<\/li>\n<li><a class=\"wl\" href=\"#protolabs-cost-2026\">如何降低 CNC 加工成本 2026<\/a>：如何降低 CNC 加工成本（Protolabs）<\/li>\n<\/ul>\n<h2>加工（processes）<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#cnc-turning\">CNC 車削<\/a>：CNC 車削<\/li>\n<li><a class=\"wl\" href=\"#cnc-milling\">CNC 銑削<\/a>：CNC 銑削<\/li>\n<\/ul>\n<h2>零件（parts）<\/h2>\n<ul>\n<li><a class=\"wl\" href=\"#end-mill\">端銑刀<\/a>：端銑刀<\/li>\n<li><a class=\"wl\" href=\"#
